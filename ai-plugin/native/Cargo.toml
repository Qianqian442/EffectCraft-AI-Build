[package]
name = "effectcraft-ai-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "effectcraft_ai"
crate-type = ["cdylib"]

[dependencies]
jni = "0.22"
llama-cpp-2 = { version = "=0.1.161", default-features = false }
llama-cpp-sys-2 = { version = "=0.1.161", default-features = false, features = ["static-stdcxx"] }

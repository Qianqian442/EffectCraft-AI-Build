services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: effectcraft
      POSTGRES_USER: effectcraft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - effectcraft-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U effectcraft -d effectcraft"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]
  api:
    build: .
    restart: unless-stopped
    environment:
      PORT: 8788
      DATABASE_URL: postgres://effectcraft:${POSTGRES_PASSWORD}@db:5432/effectcraft
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
    depends_on:
      db: { condition: service_healthy }
    expose: ["8788"]
    networks: [private]
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [private]
volumes:
  effectcraft-db:
networks:
  private:

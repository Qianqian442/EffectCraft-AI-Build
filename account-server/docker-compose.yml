services:
  effectcraft-accounts:
    build: .
    container_name: effectcraft-home-accounts
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    volumes:
      - effectcraft-account-data:/data
    ports:
      # Bind only to the detected home-LAN IPv4 address; default to loopback if unset.
      - "${HOME_LAN_IP:-127.0.0.1}:8787:8787"
volumes:
  effectcraft-account-data:

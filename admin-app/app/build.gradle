plugins {
    id "com.android.application"
}
android {
    namespace "com.qianqian.effectcraftadmin"
    compileSdk 35

    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId "com.qianqian.effectcraftadmin"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "1.3"
        buildConfigField "String", "ACCOUNT_API_URL", "\"${System.getenv('AE_ACCOUNT_API_URL') ?: ''}\""
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
}


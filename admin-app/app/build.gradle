// Trigger a fresh standalone admin APK build; no application behavior changed. Cloud account API now uses single-call password migration.
plugins {
    id "com.android.application"
}
android {
    namespace "com.qianqian.effectcraftadmin"
    compileSdk 35

    buildFeatures { buildConfig true }
    // Keep the package ID, signing identity and persistent app data stable for in-place updates.
    // CI run numbers provide a monotonically increasing versionCode for every APK.
    def adminBuildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "5").toInteger()
    defaultConfig {
        applicationId "com.qianqian.effectcraftadmin"
        minSdk 26
        targetSdk 35
        versionCode adminBuildNumber
        versionName "1.4." + adminBuildNumber
        buildConfigField "String", "ACCOUNT_API_URL", "\"${System.getenv('AE_ACCOUNT_API_URL') ?: 'https://ae-account-api-gateway.pages.dev'}\""
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            // Pin debug APK signing to the keystore persisted by the build workflow.
            // Do not rely on AGP's implicit default debug key location.
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
}


[package]
name = "effectcraft-p2p"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
name = "effectcraft_p2p"
crate-type = ["cdylib", "rlib"]

[dependencies]
futures = "0.3"
jni = "0.21.1"
libp2p = { version = "=0.57.1", default-features = false, features = [
  "autonat", "dcutr", "dns", "ed25519", "identify", "kad", "macros",
  "mdns", "noise", "ping", "quic", "relay", "request-response", "json", "rsa", "tcp", "tls", "tokio", "websocket", "yamux"
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"

# This crate is copied under the EffectCraft Cargo workspace during Android packaging.
# Keep it an independent workspace so cargo-ndk does not parse the generated launcher manifest.
[workspace]

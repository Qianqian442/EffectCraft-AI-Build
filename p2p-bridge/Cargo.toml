[package]
name = "effectcraft-p2p"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
name = "effectcraft_p2p"
crate-type = ["cdylib", "rlib"]

[dependencies]
futures = "0.3"
jni = "0.21.1"
libp2p = { version = "=0.57.1", default-features = false, features = [
  "autonat", "dcutr", "dns", "ed25519", "identify", "kad", "macros",
  "mdns", "noise", "ping", "quic", "relay", "tcp", "tokio", "yamux"
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
serde_json = "1"

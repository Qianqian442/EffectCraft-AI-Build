name: Deploy Ae Pages account API gateway

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-pages-proxy/**'
      - '.github/workflows/deploy-pages-account-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ae-pages-account-api-gateway
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Pages gateway and verify Worker health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare-pages-proxy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Pages gateway source and config
        run: |
          set -euo pipefail
          test -s dist/_worker.js
          grep -Fq 'env.ACCOUNT_API.fetch(request)' dist/_worker.js
          grep -Fq '"service": "ae-cloud-account-api"' wrangler.jsonc
          grep -Fq '"binding": "ACCOUNT_API"' wrangler.jsonc
          echo "Validated fixed service binding to the existing Ae account Worker."

      - name: Create Pages project if needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '6ed9bd81b9aef69ba61060f33510f014' }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare API token or account ID is missing."
            exit 1
          fi
          for PROJECT in ae-account-api-gateway ae-account-api-gateway-alt; do
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main || {
              echo "Pages project $PROJECT may already exist; continuing to deployment."
            }
          done

      - name: Deploy Pages gateway
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '6ed9bd81b9aef69ba61060f33510f014' }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist --project-name ae-account-api-gateway --branch main
          npx --yes wrangler@4 pages deploy dist --project-name ae-account-api-gateway-alt --branch main
          GATEWAY_URL="https://ae-account-api-gateway.pages.dev"
          ALT_GATEWAY_URL="https://ae-account-api-gateway-alt.pages.dev"
          echo "gateway_url=$GATEWAY_URL" >> "$GITHUB_OUTPUT"
          echo "alt_gateway_url=$ALT_GATEWAY_URL" >> "$GITHUB_OUTPUT"
          echo "Primary Pages gateway: $GATEWAY_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Alternate Pages gateway: $ALT_GATEWAY_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify service binding and account Worker health
        env:
          GATEWAY_URL: ${{ steps.deploy.outputs.gateway_url }}
          ALT_GATEWAY_URL: ${{ steps.deploy.outputs.alt_gateway_url }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          for URL in "$GATEWAY_URL" "$ALT_GATEWAY_URL"; do
            RESPONSE="$(curl --silent --show-error --retry 8 --retry-all-errors --retry-delay 3 -H "x-effectcraft-health-token: $JWT_SECRET" "$URL/health/deep")"
            printf '%s\\n' "$URL $RESPONSE"
            printf '%s' "$RESPONSE" | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const health = JSON.parse(input); if (health.ok !== true || health.database !== true || health.password_service !== true) process.exit(1); });'
            echo "Verified $URL through the Pages Service binding; D1 and password hash/verify self-test passed." >> "$GITHUB_STEP_SUMMARY"
          done

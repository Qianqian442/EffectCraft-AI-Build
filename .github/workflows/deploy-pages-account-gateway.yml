name: Deploy Ae Pages account API gateway

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-pages-proxy/**'
      - '.github/workflows/deploy-pages-account-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ae-pages-account-api-gateway
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Pages gateway and verify Worker health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare-pages-proxy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Pages gateway source and config
        run: |
          set -euo pipefail
          test -s dist/_worker.js
          grep -Fq 'env.ACCOUNT_API.fetch(request)' dist/_worker.js
          grep -Fq '"service": "ae-cloud-account-api"' wrangler.jsonc
          grep -Fq '"binding": "ACCOUNT_API"' wrangler.jsonc
          echo "Validated fixed service binding to the existing Ae account Worker."

      - name: Create Pages project if needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '6ed9bd81b9aef69ba61060f33510f014' }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare API token or account ID is missing."
            exit 1
          fi
          npx --yes wrangler@4 pages project create ae-account-api-gateway --production-branch main || {
            echo "Pages project may already exist; continuing to deployment."
          }

      - name: Deploy Pages gateway
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '6ed9bd81b9aef69ba61060f33510f014' }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist --project-name ae-account-api-gateway --branch main
          GATEWAY_URL="https://ae-account-api-gateway.pages.dev"
          echo "gateway_url=$GATEWAY_URL" >> "$GITHUB_OUTPUT"
          echo "Pages gateway URL: $GATEWAY_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify service binding and account Worker health
        env:
          GATEWAY_URL: ${{ steps.deploy.outputs.gateway_url }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 3 "$GATEWAY_URL/health")"
          printf '%s\\n' "$RESPONSE"
          printf '%s' "$RESPONSE" | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const health = JSON.parse(input); if (health.ok !== true || health.database !== true) process.exit(1); });'
          echo "Pages Service binding successfully reached the existing account Worker and D1." >> "$GITHUB_STEP_SUMMARY"
          echo "Gateway health check: $RESPONSE" >> "$GITHUB_STEP_SUMMARY"

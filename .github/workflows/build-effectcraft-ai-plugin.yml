name: Build Ae DeepSeek AI model package (ZIP only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-effectcraft-ai-plugin.yml'
      - 'android-ai-plugin/**'

permissions:
  contents: write

concurrency:
  group: ae-deepseek-model-package
  cancel-in-progress: false

jobs:
  package:
    name: Download, verify and package the local DeepSeek model
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      MODEL_FILE: DeepSeek-R1-Distill-Qwen-1.5B-IQ4_XS.gguf
      MODEL_URL: https://huggingface.co/bartowski/DeepSeek-R1-Distill-Qwen-1.5B-GGUF/resolve/main/DeepSeek-R1-Distill-Qwen-1.5B-IQ4_XS.gguf?download=true
    steps:
      - name: Check out Ae model-package metadata
        uses: actions/checkout@v4

      - name: Download the 1.5B quantized DeepSeek model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          curl --fail --location --show-error --retry 6 --retry-all-errors \
            --connect-timeout 30 --max-time 10800 \
            "$MODEL_URL" -o "package/$MODEL_FILE"
          SIZE="$(stat -c%s "package/$MODEL_FILE")"
          if (( SIZE < 500 * 1024 * 1024 || SIZE > 2 * 1024 * 1024 * 1024 )); then
            echo "Unexpected local model size: $SIZE bytes" >&2
            exit 1
          fi
          sha256sum "package/$MODEL_FILE" | tee package/model.sha256
          echo "Downloaded model size: $SIZE bytes"

      - name: Create the importable AI model bundle
        shell: bash
        run: |
          set -euo pipefail
          cd package
          SIZE="$(stat -c%s "$MODEL_FILE")"
          HASH="$(sha256sum "$MODEL_FILE" | awk '{print $1}')"
          cat > ai-model.json <<EOF
          {
            "format": "ae-ai-model-package",
            "format_version": 1,
            "id": "ae.deepseek.r1.distill.qwen.1.5b.iq4_xs",
            "name": "Ae DeepSeek R1 Distill Qwen 1.5B IQ4_XS",
            "model_file": "$MODEL_FILE",
            "size_bytes": $SIZE,
            "sha256": "$HASH",
            "runtime": "llama.cpp Android ARM64",
            "offline_after_import": true
          }
          EOF
          # Store the GGUF without recompressing it; the app verifies the manifest and hash.
          zip -0 -q ../Ae-DeepSeek-AI-Plugin.zip ai-model.json "$MODEL_FILE"
          cd ..
          unzip -tq Ae-DeepSeek-AI-Plugin.zip
          unzip -Z1 Ae-DeepSeek-AI-Plugin.zip | grep -Fxq ai-model.json
          unzip -Z1 Ae-DeepSeek-AI-Plugin.zip | grep -Fxq "$MODEL_FILE"
          sha256sum Ae-DeepSeek-AI-Plugin.zip
          stat -c 'AI model ZIP size: %s bytes' Ae-DeepSeek-AI-Plugin.zip

      - name: Upload the importable AI model ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Ae-DeepSeek-AI-Model-Package
          path: Ae-DeepSeek-AI-Plugin.zip
          compression-level: 0
          retention-days: 30

      - name: Publish the model package
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ae-deepseek-model-${{ github.run_number }}
          name: Ae DeepSeek AI 模型包（ZIP）
          body: |
            Importable data-only AI model package for Ae.
            It contains ai-model.json and the quantized GGUF model. It is not an APK and does not install another application.
            In Ae, open AI 助手 → 导入 AI 模型包, then select this ZIP. The app verifies the package metadata, byte count and SHA-256 before activating the local model.
            The main Ae APK contains the Android AI runtime and model manager; this ZIP supplies the approximately 1.02 GB model data.
          files: Ae-DeepSeek-AI-Plugin.zip
          draft: false
          prerelease: true

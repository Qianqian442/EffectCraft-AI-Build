name: Build EffectCraft AI Plugin APK

on:
  push:
    branches: [ai-plugin-prototype]
    paths:
      - "ai-plugin/**"
      - ".github/workflows/build-ai-plugin.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: effectcraft-ai-plugin-prototype
  cancel-in-progress: true

jobs:
  build:
    name: Build standalone AI companion APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER_DIR="$(dirname "$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)")"
          test -x "$SDKMANAGER_DIR/sdkmanager"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDKMANAGER_DIR/sdkmanager" --licenses >/dev/null
          set -o pipefail


      - name: Install Android build components
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Restore shared EffectCraft signing key
        id: shared_signing_key
        uses: actions/cache/restore@v4
        with:
          path: artcraft/keys
          key: effectcraft-apk-signing-v1-${{ github.repository_id }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ai-plugin/native/target
          key: effectcraft-ai-plugin-cargo-v2-${{ runner.os }}-${{ hashFiles('ai-plugin/native/Cargo.toml') }}
          restore-keys: |
            effectcraft-ai-plugin-cargo-v2-${{ runner.os }}-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build ARM64 native inference library
        working-directory: ai-plugin/native
        run: |
          set -euo pipefail
          cargo ndk -t arm64-v8a -P 28 -o ../app/src/main/jniLibs build --release
          test -s ../app/src/main/jniLibs/arm64-v8a/libeffectcraft_ai.so
          file ../app/src/main/jniLibs/arm64-v8a/libeffectcraft_ai.so

      - name: Configure the same signing certificate as the main APK
        shell: bash
        run: |
          set -euo pipefail
          KEY="artcraft/keys/artcraft-builder.jks"
          PASS="artcraft/keys/.keystore-password"
          test -s "$KEY" && test -s "$PASS" || {
            echo "The shared EffectCraft signing key was not restored; do not create a different plugin identity." >&2
            exit 1
          }
          chmod 600 "$KEY" "$PASS"
          PASSWORD="$(<"$PASS")"
          keytool -list -keystore "$KEY" -storepass "$PASSWORD" -alias artcraftbuilder >/dev/null
          echo "AI_PLUGIN_KEYSTORE=$GITHUB_WORKSPACE/$KEY" >> "$GITHUB_ENV"
          echo "AI_PLUGIN_STORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "AI_PLUGIN_KEY_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build signed plugin APK
        run: gradle --no-daemon --stacktrace -p ai-plugin assembleRelease

      - name: Verify plugin APK
        run: |
          set -euo pipefail
          APK="ai-plugin/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -tq "$APK"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libeffectcraft_ai.so"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.artcraft.effectcraft.aiassistant'"
          sha256sum "$APK"
          stat -c 'AI plugin APK size: %s bytes' "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: EffectCraft-AI-Plugin-APK
          path: ai-plugin/app/build/outputs/apk/release/app-release.apk
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish DeepSeek plugin APK (no device install test)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified plugin APK
        uses: actions/download-artifact@v4
        with:
          name: EffectCraft-AI-Plugin-APK
          path: release
      - name: Verify artifact transfer
        shell: bash
        run: |
          set -euo pipefail
          APK="release/app-release.apk"
          test -s "$APK"
          stat -c 'AI plugin APK size: %s bytes' "$APK"
          sha256sum "$APK"
      - name: Publish standalone DeepSeek plugin release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: effectcraft-deepseek-plugin-${{ github.run_number }}
          name: EffectCraft DeepSeek AI Plugin (Build ${{ github.run_number }})
          body: |
            Standalone DeepSeek local-inference companion APK for EffectCraft.
            The GGUF model is downloaded or imported inside the plugin, not bundled in either APK.
            Build-time APK integrity, signature and ARM64 library checks passed.
            No Android emulator or device installation test is run in this workflow.
          files: release/app-release.apk
          draft: false
          prerelease: true

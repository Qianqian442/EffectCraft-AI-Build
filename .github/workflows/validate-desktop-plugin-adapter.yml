name: Validate desktop plug-in compatibility adapter

on:
  push:
    branches: [main, desktop-plugin-compat, capcut-and-ae-export-interop]
    paths:
      - '.github/scripts/add_desktop_plugin_package_support.py'
      - '.github/scripts/add_plugin_migration_progress.py'
      - '.github/scripts/add_plugin_import_button.py'
      - '.github/scripts/add_zip_plugin_support.py'
      - '.github/scripts/install_ai_plugin_bridge.py'
      - '.github/scripts/ai_assistant_plugin.rs'
      - '.github/scripts/add_curve_quick_access.py'
      - '.github/scripts/add_startup_attribution_notice.py'
      - '.github/scripts/patch_export_dialog.py'
      - '.github/scripts/configure_four_project_export_buttons.py'
      - '.github/scripts/add_project_import_formats.py'
      - '.github/scripts/backport_aep_export.py'
      - '.github/scripts/add_am_nv_project_import.py'
      - '.github/scripts/am_nv.rs'
      - '.github/scripts/add_qq_project_share.py'
      - '.github/scripts/add_chroma_key_effect.py'
      - '.github/workflows/validate-desktop-plugin-adapter.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/add_desktop_plugin_package_support.py'
      - '.github/scripts/add_plugin_migration_progress.py'
      - '.github/scripts/add_plugin_import_button.py'
      - '.github/scripts/add_zip_plugin_support.py'
      - '.github/scripts/patch_export_dialog.py'
      - '.github/scripts/configure_four_project_export_buttons.py'
      - '.github/scripts/add_project_import_formats.py'
      - '.github/scripts/backport_aep_export.py'
      - '.github/scripts/add_am_nv_project_import.py'
      - '.github/scripts/am_nv.rs'
      - '.github/scripts/patch_export_dialog.py'
      - '.github/scripts/configure_four_project_export_buttons.py'
      - '.github/scripts/add_qq_project_share.py'
      - '.github/workflows/validate-desktop-plugin-adapter.yml'
  workflow_dispatch:

concurrency:
  group: desktop-plugin-adapter-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-v0211-integration:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out compatibility adapter
        uses: actions/checkout@v4

      - name: Check out ArtCraft Android builder v0.5.0
        uses: actions/checkout@v4
        with:
          repository: MostafaXS1/artcraft-android
          ref: v0.5.0
          path: artcraft

      - name: Check out EffectCraft v0.21.1
        uses: actions/checkout@v4
        with:
          repository: storytold/effectcraft
          ref: v0.21.1
          path: effectcraft

      - name: Check out upstream native After Effects exporter source
        uses: actions/checkout@v4
        with:
          repository: storytold/effectcraft
          ref: ce9eaec65015a5508c72af0e2351cd02612c9450
          path: upstream-aep-export
          sparse-checkout: |
            crates/aep/src/export.rs
            crates/aep/src/export
            crates/engine/src/cmd/aep.rs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Syntax-check all Android plug-in patch scripts
        run: |
          python3 -m py_compile \
            .github/scripts/add_plugin_import_button.py \
            .github/scripts/add_zip_plugin_support.py \
            .github/scripts/add_desktop_plugin_package_support.py \
            .github/scripts/add_plugin_migration_progress.py \
            .github/scripts/install_ai_plugin_bridge.py \
            .github/scripts/add_curve_quick_access.py \
            .github/scripts/add_startup_attribution_notice.py \
            .github/scripts/patch_export_dialog.py \
            .github/scripts/configure_four_project_export_buttons.py \
            .github/scripts/backport_aep_export.py \
            .github/scripts/add_project_import_formats.py \
            .github/scripts/add_am_nv_project_import.py \
            .github/scripts/add_chroma_key_effect.py

      - name: Apply the same plug-in patches used by the APK build
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/effectcraft
        run: |
          python3 .github/scripts/add_plugin_import_button.py
          python3 .github/scripts/add_zip_plugin_support.py
          python3 .github/scripts/add_desktop_plugin_package_support.py
          python3 .github/scripts/add_plugin_migration_progress.py

      - name: Apply the AI and export toolbar base patch used by the APK build
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: |
          mkdir -p artcraft/source
          if [ ! -e artcraft/source/effectcraft ]; then
            ln -s "$GITHUB_WORKSPACE/effectcraft" artcraft/source/effectcraft
          fi
          python3 - <<'PY'
          import base64, re, zlib
          from pathlib import Path
          workflow = Path(".github/workflows/build-effectcraft-ai.yml").read_text(encoding="utf-8")
          match = re.search(r'payload = "([A-Za-z0-9+/=]+)"', workflow)
          if not match:
              raise SystemExit("Could not find the shared AI/export source patch in the APK workflow.")
          Path("/tmp/patch_effectcraft_ai.py").write_bytes(zlib.decompress(base64.b64decode(match.group(1))))
          PY
          mkdir -p "$EFFECTCRAFT_DIR/assets"
          cp "$GITHUB_WORKSPACE/assets/ae-avatar.png" "$EFFECTCRAFT_DIR/assets/ae-avatar.png"
          python3 /tmp/patch_effectcraft_ai.py
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["EFFECTCRAFT_DIR"]) / "crates/ui-egui/src/ai_assistant.rs"
          s = p.read_text()
          old = 'const DEFAULT_CHAT_MODEL: &str = "Qwen/Qwen3-8B";'
          new = 'const DEFAULT_CHAT_MODEL: &str = "deepseek-ai/DeepSeek-R1-0528-Qwen3-8B";'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Apply the Android export dialog patch and compile its UI
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: |
          mkdir -p artcraft/source
          if [ ! -e artcraft/source/effectcraft ]; then
            ln -s "$GITHUB_WORKSPACE/effectcraft" artcraft/source/effectcraft
          fi
          python3 .github/scripts/patch_export_dialog.py

      - name: Configure five project export buttons with complete mobile media collection
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: python3 .github/scripts/configure_four_project_export_buttons.py

      - name: Validate post-export direct QQ project sharing
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
          ARTCRAFT_DIR: ${{ github.workspace }}/artcraft
        run: |
          python3 -m py_compile .github/scripts/add_android_gallery_export.py .github/scripts/add_qq_project_share.py
          python3 .github/scripts/add_android_gallery_export.py
          python3 .github/scripts/add_qq_project_share.py
          grep -F 'EFFECTCRAFT_SHARE_FILEPROVIDER_V1' artcraft/lib/android_project.py
          grep -F 'EFFECTCRAFT_ANDROID_EXPORT_FILE_QQ_SHARE_V2' artcraft/templates/android/SafActivity.java
          grep -F 'qqSend.setPackage("com.tencent.mobileqq")' artcraft/templates/android/SafActivity.java
          grep -F '分享到QQ或其他应用' artcraft/templates/android/SafActivity.java
          grep -F 'share_exported_project' artcraft/source/effectcraft/crates/ui-egui/src/android_gallery.rs
          grep -F 'Ae 手机版完整工程导出（含素材）' artcraft/source/effectcraft/crates/ui-egui/src/header.rs
          grep -F 'let mut errors: Vec<String> = Vec::new();' artcraft/source/effectcraft/crates/engine/src/cmd/file_more.rs
          grep -F 'pairs.push((src.clone(), dst, relative));' artcraft/source/effectcraft/crates/engine/src/cmd/file_more.rs
          grep -F 'new_paths.push(relative.clone());' artcraft/source/effectcraft/crates/engine/src/cmd/file_more.rs
          grep -F '工程素材收集不完整' artcraft/source/effectcraft/crates/engine/src/cmd/file_more.rs
          grep -F 'zipProjectDirectory(projectRoot, sharePayload)' artcraft/templates/android/SafActivity.java
          grep -F 'private static void addProjectFiles' artcraft/templates/android/SafActivity.java

      - name: Validate the single unified AM/NV/AE/CapCut project import control
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/effectcraft
        run: |
          python3 .github/scripts/add_project_import_formats.py
          python3 .github/scripts/add_am_nv_project_import.py
          grep -F 'lower.ends_with(".aep") || lower.ends_with(".aepx")' effectcraft/crates/engine/src/cmd/import_project.rs
          grep -F '"aep", "aepx"' effectcraft/crates/ui-egui/src/menus/frontend.rs
          grep -F '导入am/NV/Ae/capcut工程' effectcraft/crates/engine/src/menus.rs
          grep -F 'matches!(ext(&actual).as_str(), "ecproj" | "ecprojx")' .github/scripts/am_nv.rs
          grep -F 'super::import_project::import_project' .github/scripts/am_nv.rs
          grep -F 'MAX_ZIP_TOTAL' .github/scripts/am_nv.rs
          grep -F 'MAX_ZIP_ENTRIES' .github/scripts/am_nv.rs

      - name: Backport native Ae project export for Rust/UI compile validation
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
          AEP_EXPORT_SOURCE_DIR: ${{ github.workspace }}/upstream-aep-export
        run: python3 .github/scripts/backport_aep_export.py

      - name: Apply standalone DeepSeek AI plugin bridge
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/effectcraft
          ARTCRAFT_DIR: ${{ github.workspace }}/artcraft
        run: |
          mkdir -p "$EFFECTCRAFT_DIR/assets"
          cp "$GITHUB_WORKSPACE/assets/ae-avatar.png" "$EFFECTCRAFT_DIR/assets/ae-avatar.png"
          python3 .github/scripts/install_ai_plugin_bridge.py

      - name: Apply Android curve presets and startup attribution notice
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/effectcraft
        run: |
          python3 .github/scripts/add_curve_quick_access.py
          python3 .github/scripts/add_startup_attribution_notice.py

      - name: Apply the beginner-friendly Chroma Key controls
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/effectcraft
        run: python3 .github/scripts/add_chroma_key_effect.py

      - name: Apply the same Simplified Chinese Android defaults and UI controls as the APK
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/effectcraft
        run: |
          python3 -m py_compile .github/scripts/add_chinese_group_puppet_keyframe_ui.py
          python3 .github/scripts/add_chinese_group_puppet_keyframe_ui.py
          grep -F 'language: String = "zh-hans".into(),' effectcraft/crates/engine/src/settings/prefs/sections.rs
          grep -F '"zh-hans"' effectcraft/crates/ui-egui/src/i18n.rs

      - name: Compile-check v0.21.1 engine and Android UI integration
        working-directory: effectcraft
        env:
          CARGO_BUILD_JOBS: '2'
        run: cargo check -p effectcraft-engine -p effectcraft-ui-egui

      - name: Audit Simplified Chinese menu, panel, dialog and setting translations
        working-directory: effectcraft
        env:
          CARGO_BUILD_JOBS: '2'
        run: cargo test -p effectcraft-ui-egui --lib missing_translations_report -- --nocapture

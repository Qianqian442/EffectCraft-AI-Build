name: Validate desktop plug-in compatibility adapter

on:
  push:
    branches: [main, desktop-plugin-compat]
    paths:
      - '.github/scripts/add_desktop_plugin_package_support.py'
      - '.github/scripts/add_plugin_migration_progress.py'
      - '.github/scripts/add_plugin_import_button.py'
      - '.github/scripts/add_zip_plugin_support.py'
      - '.github/scripts/install_ai_plugin_bridge.py'
      - '.github/scripts/ai_assistant_plugin.rs'
      - '.github/scripts/add_curve_quick_access.py'
      - '.github/scripts/add_startup_attribution_notice.py'
      - '.github/scripts/patch_export_dialog.py'
      - '.github/scripts/add_project_import_formats.py'
      - '.github/scripts/add_am_nv_project_import.py'
      - '.github/workflows/validate-desktop-plugin-adapter.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/add_desktop_plugin_package_support.py'
      - '.github/scripts/add_plugin_migration_progress.py'
      - '.github/scripts/add_plugin_import_button.py'
      - '.github/scripts/add_zip_plugin_support.py'
      - '.github/scripts/patch_export_dialog.py'
      - '.github/scripts/add_project_import_formats.py'
      - '.github/scripts/add_am_nv_project_import.py'
      - '.github/workflows/validate-desktop-plugin-adapter.yml'
  workflow_dispatch:

concurrency:
  group: desktop-plugin-adapter-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-v0211-integration:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out compatibility adapter
        uses: actions/checkout@v4

      - name: Check out ArtCraft Android builder v0.5.0
        uses: actions/checkout@v4
        with:
          repository: MostafaXS1/artcraft-android
          ref: v0.5.0
          path: artcraft

      - name: Check out EffectCraft v0.21.1
        uses: actions/checkout@v4
        with:
          repository: storytold/effectcraft
          ref: v0.21.1
          path: effectcraft

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Syntax-check all Android plug-in patch scripts
        run: |
          python3 -m py_compile \
            .github/scripts/add_plugin_import_button.py \
            .github/scripts/add_zip_plugin_support.py \
            .github/scripts/add_desktop_plugin_package_support.py \
            .github/scripts/add_plugin_migration_progress.py \
            .github/scripts/install_ai_plugin_bridge.py \
            .github/scripts/add_curve_quick_access.py \
            .github/scripts/add_startup_attribution_notice.py \
            .github/scripts/patch_export_dialog.py \
            .github/scripts/add_project_import_formats.py \
            .github/scripts/add_am_nv_project_import.py

      - name: Apply the same plug-in patches used by the APK build
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/effectcraft
        run: |
          python3 .github/scripts/add_plugin_import_button.py
          python3 .github/scripts/add_zip_plugin_support.py
          python3 .github/scripts/add_desktop_plugin_package_support.py
          python3 .github/scripts/add_plugin_migration_progress.py

      - name: Apply the AI and export toolbar base patch used by the APK build
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: |
          mkdir -p artcraft/source
          if [ ! -e artcraft/source/effectcraft ]; then
            ln -s "$GITHUB_WORKSPACE/effectcraft" artcraft/source/effectcraft
          fi
          python3 - <<'PY'
          import base64, re, zlib
          from pathlib import Path
          workflow = Path(".github/workflows/build-effectcraft-ai.yml").read_text(encoding="utf-8")
          match = re.search(r'payload = "([A-Za-z0-9+/=]+)"', workflow)
          if not match:
              raise SystemExit("Could not find the shared AI/export source patch in the APK workflow.")
          Path("/tmp/patch_effectcraft_ai.py").write_bytes(zlib.decompress(base64.b64decode(match.group(1))))
          PY
          mkdir -p "$EFFECTCRAFT_DIR/assets"
          cp "$GITHUB_WORKSPACE/assets/ae-avatar.png" "$EFFECTCRAFT_DIR/assets/ae-avatar.png"
          python3 /tmp/patch_effectcraft_ai.py
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["EFFECTCRAFT_DIR"]) / "crates/ui-egui/src/ai_assistant.rs"
          s = p.read_text()
          old = 'const DEFAULT_CHAT_MODEL: &str = "Qwen/Qwen3-8B";'
          new = 'const DEFAULT_CHAT_MODEL: &str = "deepseek-ai/DeepSeek-R1-0528-Qwen3-8B";'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Apply the Android export dialog patch and compile its UI
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: |
          mkdir -p artcraft/source
          if [ ! -e artcraft/source/effectcraft ]; then
            ln -s "$GITHUB_WORKSPACE/effectcraft" artcraft/source/effectcraft
          fi
          python3 .github/scripts/patch_export_dialog.py

      - name: Validate the original AE menu and connect AEP/AEPX to Import Project
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/effectcraft
        run: |
          python3 .github/scripts/add_project_import_formats.py
          python3 .github/scripts/add_am_nv_project_import.py
          grep -F 'lower.ends_with(".aep") || lower.ends_with(".aepx")' effectcraft/crates/engine/src/cmd/import_project.rs
          grep -F '"aep", "aepx"' effectcraft/crates/ui-egui/src/menus/frontend.rs

      - name: Apply standalone DeepSeek AI plugin bridge
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/effectcraft
          ARTCRAFT_DIR: ${{ github.workspace }}/artcraft
        run: |
          mkdir -p "$EFFECTCRAFT_DIR/assets"
          cp "$GITHUB_WORKSPACE/assets/ae-avatar.png" "$EFFECTCRAFT_DIR/assets/ae-avatar.png"
          python3 .github/scripts/install_ai_plugin_bridge.py

      - name: Apply Android curve presets and startup attribution notice
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/effectcraft
        run: |
          python3 .github/scripts/add_curve_quick_access.py
          python3 .github/scripts/add_startup_attribution_notice.py

      - name: Compile-check v0.21.1 engine and Android UI integration
        working-directory: effectcraft
        env:
          CARGO_BUILD_JOBS: '2'
        run: cargo check -p effectcraft-engine -p effectcraft-ui-egui

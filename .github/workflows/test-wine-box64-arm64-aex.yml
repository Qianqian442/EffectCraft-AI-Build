name: Audit Bionic Wine Host and Build Windows AEX Test Inputs

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/windows-plugin-runtime
    paths:
      - 'windows-compat/aexlo-host/**'
      - 'windows-compat/runtime-manifest.json'
      - '.github/workflows/test-wine-box64-arm64-aex.yml'

permissions:
  contents: read

concurrency:
  group: effectcraft-wine-box64-arm64-aex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-aex-worker:
    name: Build Windows x64 AEX host and sample plug-in
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out compatibility code
        uses: actions/checkout@v4

      - name: Check out pinned aexlo source
        uses: actions/checkout@v4
        with:
          repository: potistudio/aexlo
          ref: 32c3fe399bc7d2deb3e5f9a02c627db50d8e7ff9
          path: third_party/aexlo

      - name: Set up Rust Windows x64 toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Generate pinned host dependency lockfile
        run: cargo generate-lockfile --manifest-path windows-compat/aexlo-host/Cargo.toml

      - name: Build Windows x64 AEX host worker
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc --manifest-path windows-compat/aexlo-host/Cargo.toml
          cargo build --release --target x86_64-pc-windows-msvc --manifest-path third_party/aexlo/examples/plugins/noise/Cargo.toml
          Get-ChildItem -Recurse -Filter effectcraft-aex-host.exe
          if (!(Test-Path "windows-compat/aexlo-host/target/x86_64-pc-windows-msvc/release/effectcraft-aex-host.exe")) { throw "AEX host worker missing after Cargo build" }
          if (!(Test-Path "third_party/aexlo/target/x86_64-pc-windows-msvc/release/aexlo_demo_noise.dll")) { throw "AEX sample plug-in missing" }

      - name: Package cross-architecture AEX smoke test inputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item "windows-compat/aexlo-host/target/x86_64-pc-windows-msvc/release/effectcraft-aex-host.exe" "artifacts/"
          Copy-Item "third_party/aexlo/target/x86_64-pc-windows-msvc/release/aexlo_demo_noise.dll" "artifacts/sample.aex"
          Copy-Item "third_party/aexlo/fixtures/input.png" "artifacts/input.png"
          Copy-Item "third_party/aexlo/LICENSE" "artifacts/AEXLO-MIT-LICENSE"

      - name: Upload Windows AEX test inputs
        uses: actions/upload-artifact@v4
        with:
          name: EffectCraft-Windows-x64-AEX-Test-Inputs
          path: artifacts/*
          retention-days: 7

  audit-bionic-wine-host-on-arm64:
    name: Verify Bionic Wine host must use linker64 (not glibc Box64)
    needs: build-windows-aex-worker
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Check out compatibility configuration
        uses: actions/checkout@v4

      - name: Install archive and ELF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils file binutils

      - name: Download and verify Winlator Bionic Proton x86-64
        run: |
          set -euo pipefail
          mkdir -p work imagefs/opt/proton-9.0-x86_64 audit
          base="https://gitlab.com/winlator3/winlator-extra/-/raw/main/proton"
          curl -fL --retry 3 "$base/proton-9.0-x86_64.txz" -o work/proton-9.0-x86_64.txz
          curl -fL --retry 3 "$base/proton-9.0-x86_64.txz.sha256sum" -o work/proton-9.0-x86_64.txz.sha256sum
          python3 - <<'PY'
          import hashlib, re
          from pathlib import Path
          data = Path("work/proton-9.0-x86_64.txz").read_bytes()
          sidecar = Path("work/proton-9.0-x86_64.txz.sha256sum").read_text()
          match = re.search(r"(?i)\b([0-9a-f]{64})\b", sidecar)
          assert match, "Proton SHA-256 sidecar is invalid"
          actual = hashlib.sha256(data).hexdigest()
          assert actual.lower() == match.group(1).lower(), f"Proton SHA-256 mismatch: {actual}"
          Path("audit/PROTON-SHA256.txt").write_text(actual + "  proton-9.0-x86_64.txz\n")
          print(f"Verified Bionic Proton archive: {len(data)} bytes, SHA-256 {actual}")
          PY
          tar -xJf work/proton-9.0-x86_64.txz -C imagefs/opt/proton-9.0-x86_64

      - name: Audit Wine host interpreter and prevent invalid Box64 pairing
        run: |
          set -euo pipefail
          wine="$PWD/imagefs/opt/proton-9.0-x86_64/bin/wine"
          test -x "$wine"
          file "$wine" | tee audit/WINE-FILE.txt
          readelf -l "$wine" | tee audit/WINE-PROGRAM-HEADERS.txt
          grep -Fq '/system/bin/linker64' audit/WINE-PROGRAM-HEADERS.txt
          echo "Confirmed: this Wine launcher is an Android Bionic ELF. It must be launched by Android /system/bin/linker64 from an app process; do not wrap it in a glibc-built Box64 host."
          printf '%s\n' "This is a host-ABI audit only. It does not execute Wine or a Windows PE." > audit/RESULT.txt
          cp windows-compat/aexlo-host/Cargo.toml audit/AEX-HOST-MANIFEST.txt

      - name: Upload Bionic Wine host audit
        uses: actions/upload-artifact@v4
        with:
          name: EffectCraft-Bionic-Wine-Host-Audit
          path: audit/*
          retention-days: 30

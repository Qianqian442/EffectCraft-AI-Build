name: Build Termux Hangover 11.16 for Android Bionic

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/windows-plugin-runtime
    paths:
      - '.github/workflows/build-termux-hangover-bionic.yml'
      - 'windows-compat/research/termux-hangover-bionic-11.16-2026-11-14.md'

permissions:
  contents: read

concurrency:
  group: effectcraft-termux-hangover-bionic
  cancel-in-progress: true

jobs:
  build:
    name: Reproduce Hangover 11.16 Wine and emulator packages for aarch64
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out EffectCraft audit and workflow
        uses: actions/checkout@v4

      - name: Check out pinned official Termux package build system
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: e0ce77d242bb9f9adb48cc38dca4d69b3b6d0af9
          path: termux-packages
          fetch-depth: 1

      - name: Verify build host and install package inspection tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq python3 dpkg-dev file zstd
          command -v docker
          docker --version
          docker info >/dev/null

      - name: Set up Java 17 for the Termux SDK installer
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the pinned Termux Android SDK and NDK r30
        working-directory: termux-packages
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/lib"
          export ANDROID_HOME="$RUNNER_TEMP/lib/android-sdk-9123335"
          export NDK="$RUNNER_TEMP/lib/android-ndk-r30"
          export TERMUX_JAVA_HOME="$JAVA_HOME"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/setup-android-sdk.sh")
          source = path.read_text(encoding="utf-8")
          old = "yes | $SDK_MANAGER"
          new = "printf 'y\\\\n%.0s' {1..64} | \"$SDK_MANAGER\""
          if source.count(old) != 2:
              raise SystemExit("Pinned Termux SDK setup script changed; review its license-acceptance pipelines")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY
          git diff -- scripts/setup-android-sdk.sh > ../termux-android-sdk-pipefail.patch
          test -s ../termux-android-sdk-pipefail.patch
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          ./scripts/setup-android-sdk.sh
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-clang"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Repoint Termux build paths to the EffectCraft private runtime prefix
        working-directory: termux-packages
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/properties.sh")
          source = path.read_text(encoding="utf-8")
          replacements = [
              ('TERMUX_APP__PACKAGE_NAME="com.termux"', 'TERMUX_APP__PACKAGE_NAME="com.artcraft.effectcraft"'),
              ('TERMUX__ROOTFS_SUBDIR="files"', 'TERMUX__ROOTFS_SUBDIR="files/windows-compat"'),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"Expected exactly one Termux path setting: {old}")
              source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")
          print("Termux paths now target /data/data/com.artcraft.effectcraft/files/windows-compat.")
          PY
          git diff -- scripts/properties.sh > ../termux-hangover-effectcraft-prefix.patch
          test -s ../termux-hangover-effectcraft-prefix.patch

      - name: Make the upstream package recipe fail closed in CI
        working-directory: termux-packages
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("x11-packages/hangover-wine/build.sh")
          source = path.read_text(encoding="utf-8")
          old = "make -j $TERMUX_PKG_MAKE_PROCESSES -k || bash"
          new = 'make -j "$TERMUX_PKG_MAKE_PROCESSES" -k'
          if source.count(old) != 1:
              raise SystemExit("Pinned Termux Hangover recipe no longer matches the audited interactive make fallback")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          print("Disabled the interactive bash fallback so CI cannot mask a failed Wine build.")
          PY
          git diff -- x11-packages/hangover-wine/build.sh > ../termux-hangover-ci-recipe.patch
          test -s ../termux-hangover-ci-recipe.patch

      - name: Build the pinned Termux Hangover package set
        working-directory: termux-packages
        run: |
          set -euo pipefail
          ./build-package.sh -a aarch64 -i -j 2 hangover-wine
          ./build-package.sh -a aarch64 -i -j 2 termux-exec

      - name: Inspect package metadata, Bionic ELF and Hangover PE payloads
        run: |
          set -euo pipefail
          mkdir -p artifacts/packages artifacts/unpacked
          mapfile -t packages < <(find termux-packages/output -type f \( -name 'hangover*.deb' -o -name 'termux-exec*.deb' \) -print | sort)
          if (( ${#packages[@]} < 5 )); then
            printf 'Expected at least four Hangover packages plus termux-exec, found %s\n' "${#packages[@]}" >&2
            find termux-packages/output -type f -name '*.deb' -print >&2
            exit 1
          fi
          printf '%s\n' "${packages[@]}" > artifacts/PACKAGE-FILES.txt
          for package in "${packages[@]}"; do
            name="$(basename "$package")"
            cp "$package" "artifacts/packages/$name"
            echo "===== $name ====="
            dpkg-deb --field "$package" Package Version Architecture
            dpkg-deb --info "$package"
            destination="artifacts/unpacked/${name%.deb}"
            mkdir -p "$destination"
            dpkg-deb -x "$package" "$destination"
          done

          : > artifacts/WINE-ELF-FILES.txt
          while IFS= read -r -d '' binary; do
            base="$(basename "$binary")"
            case "$base" in wine64|wineserver|wineboot)
              if file -Lb "$binary" | grep -q 'ELF 64-bit.*ARM aarch64'; then
                echo "$binary" >> artifacts/WINE-ELF-FILES.txt
              fi
              ;;
            esac
          done < <(find -L artifacts/unpacked -type f -print0)
          if [[ ! -s artifacts/WINE-ELF-FILES.txt ]]; then
            echo "No native ARM64 Wine executable payload found in the built packages." >&2
            find artifacts/unpacked -type f -print >&2
            exit 1
          fi
          while IFS= read -r binary; do
            echo "===== $binary ====="
            file -L "$binary"
            readelf -h "$binary" | grep -E 'Class:|Machine:'
            readelf -l "$binary" | grep -F '/system/bin/linker64'
          done < artifacts/WINE-ELF-FILES.txt

          find artifacts/unpacked -type f -name 'libtermux-exec-ld-preload.so' -print > artifacts/TERMUX-EXEC-LIBRARY.txt
          if [[ ! -s artifacts/TERMUX-EXEC-LIBRARY.txt ]]; then
            echo "termux-exec LD_PRELOAD library was not packaged." >&2
            exit 1
          fi
          while IFS= read -r exec_library; do
            echo "===== $exec_library ====="
            file "$exec_library"
            readelf -h "$exec_library" | grep -E 'Class:|Machine:'
            strings "$exec_library" | grep -F '/data/data/com.artcraft.effectcraft/files/windows-compat'
          done < artifacts/TERMUX-EXEC-LIBRARY.txt

          find artifacts/unpacked -type f \( -name 'libarm64ecfex.dll' -o -name 'libwow64fex.dll' -o -name 'wowbox64.dll' \) -print > artifacts/EMULATOR-PE-FILES.txt
          for expected in libarm64ecfex.dll libwow64fex.dll wowbox64.dll; do
            grep -Fq "$expected" artifacts/EMULATOR-PE-FILES.txt || {
              echo "Missing Hangover emulator DLL: $expected" >&2
              cat artifacts/EMULATOR-PE-FILES.txt >&2
              exit 1
            }
          done

          python3 -m venv "$RUNNER_TEMP/pefile-venv"
          source "$RUNNER_TEMP/pefile-venv/bin/activate"
          python -m pip install --disable-pip-version-check pefile
          python - <<'PY'
          import pefile
          from pathlib import Path
          files = {}
          for path in Path("artifacts/unpacked").rglob("*.dll"):
              if path.name in {"libarm64ecfex.dll", "libwow64fex.dll", "wowbox64.dll"}:
                  files[path.name] = path
          expected = {"libarm64ecfex.dll", "libwow64fex.dll", "wowbox64.dll"}
          if set(files) != expected:
              raise SystemExit(f"emulator DLL set mismatch: {sorted(files)}")
          def chpe_version(pe):
              directory = pe.OPTIONAL_HEADER.DATA_DIRECTORY[10]
              if not directory.VirtualAddress:
                  return None
              offset = pe.get_offset_from_rva(directory.VirtualAddress)
              size = int.from_bytes(pe.__data__[offset:offset + 4], "little")
              if size < 0xD0:
                  return None
              chpe_va = int.from_bytes(pe.__data__[offset + 0xC8:offset + 0xD0], "little")
              if not chpe_va:
                  return None
              return int.from_bytes(pe.__data__[pe.get_offset_from_rva(chpe_va - pe.OPTIONAL_HEADER.ImageBase):][:4], "little")

          for name, path in sorted(files.items()):
              pe = pefile.PE(str(path), fast_load=False)
              chpe = chpe_version(pe)
              print(f"{name}: PE machine=0x{pe.FILE_HEADER.Machine:04x}, CHPE={chpe}, size={path.stat().st_size}")
              if name == "libarm64ecfex.dll":
                  if pe.FILE_HEADER.Machine != 0x8664 or chpe != 1:
                      raise SystemExit("libarm64ecfex.dll lacks expected x86-64 ARM64EC CHPE metadata")
              if name == "libwow64fex.dll" and pe.FILE_HEADER.Machine != 0xAA64:
                  raise SystemExit("libwow64fex.dll is not an ARM64 WoW64 emulator PE")
          PY

      - name: Record pinned source, recipe patch and checksums
        run: |
          set -euo pipefail
          cp termux-hangover-ci-recipe.patch artifacts/
          cp termux-hangover-effectcraft-prefix.patch artifacts/
          cp termux-android-sdk-pipefail.patch artifacts/
          cat > artifacts/BUILD-INFO.txt <<'EOF'
          Termux Hangover 11.16 Bionic package reproduction
          Termux package source: termux/termux-packages
          Termux source revision: e0ce77d242bb9f9adb48cc38dca4d69b3b6d0af9
          Package: x11-packages/hangover-wine
          Wine source tag: AndreRH/wine hangover-11.16
          Target architecture: aarch64 / Android Bionic
          EffectCraft application ID: com.artcraft.effectcraft
          Runtime prefix: /data/data/com.artcraft.effectcraft/files/windows-compat/usr
          Included process launcher: termux-exec 2.5.0 (Apache-2.0)
          CI-only recipe changes: EffectCraft package/rootfs path overrides; replace interactive "make -k || bash" with fail-closed make -k
          This is a cross-build/package inspection, not an Android device execution test.
          EOF
          (cd artifacts && find packages -type f -name '*.deb' -print0 | sort -z | xargs -0 sha256sum) > artifacts/PACKAGE-SHA256SUMS.txt
          tar --zstd -cf artifacts/termux-hangover-11.16-aarch64-packages.tar.zst -C artifacts packages BUILD-INFO.txt PACKAGE-FILES.txt PACKAGE-SHA256SUMS.txt WINE-ELF-FILES.txt EMULATOR-PE-FILES.txt TERMUX-EXEC-LIBRARY.txt termux-hangover-ci-recipe.patch termux-hangover-effectcraft-prefix.patch termux-android-sdk-pipefail.patch
          sha256sum artifacts/termux-hangover-11.16-aarch64-packages.tar.zst > artifacts/termux-hangover-11.16-aarch64-packages.tar.zst.sha256

      - name: Upload reproduced Bionic Hangover packages and audit
        uses: actions/upload-artifact@v4
        with:
          name: EffectCraft-Termux-Hangover-11.16-Bionic-ARM64
          path: artifacts/*
          retention-days: 30

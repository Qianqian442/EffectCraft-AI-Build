name: Build EffectCraft Account Admin APK

on:
  push:
    branches: [main, feature/own-on-demand-vpn, feature/admin-ae-account-branding]
    paths:
      - 'admin-app/**'
      - '.github/scripts/fetch_public_proxy_bootstrap.py'
      - 'p2p-bridge/**'
      - 'warp-mobile/**'
      - '.github/scripts/patch_usque_for_android.py'
      - '.github/workflows/build-account-admin.yml'
  pull_request:
    branches: [main]
    paths:
      - 'admin-app/**'
      - '.github/workflows/build-account-admin.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: effectcraft-account-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-masque-aar:
    name: Build ARM64 Cloudflare MASQUE Android core prototype
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go 1.26.3
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set +o pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER_DIR="$(dirname "$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)")"
          test -x "$SDKMANAGER_DIR/sdkmanager"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER_DIR/sdkmanager" --licenses >/dev/null
          set -o pipefail
      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.2.12479018"
      - name: Configure NDK
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
      - name: Install gomobile and gobind
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Initialize gomobile
        run: gomobile init
      - name: Build ARM64 AAR
        run: |
          chmod +x warp-mobile/build-android-aar.sh
          warp-mobile/build-android-aar.sh
      - name: Verify generated Java bridge and ARM64 native library
        run: |
          unzip -l warp-mobile/build/effectcraft-warp-masque.aar
          unzip -p warp-mobile/build/effectcraft-warp-masque.aar classes.jar > "$RUNNER_TEMP/warp-classes.jar"
          jar tf "$RUNNER_TEMP/warp-classes.jar" | grep -E 'com/effectcraft/warp|warpandroid'
      - name: Upload MASQUE engine build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EffectCraft-Cloudflare-MASQUE-ARM64-AAR
          path: warp-mobile/build/effectcraft-warp-masque.aar
          if-no-files-found: error
          retention-days: 14

  build-admin:
    name: Build standalone account manager APK
    needs: build-masque-aar
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download Cloudflare MASQUE Android engine
        uses: actions/download-artifact@v4
        with:
          name: EffectCraft-Cloudflare-MASQUE-ARM64-AAR
          path: admin-app/app/libs

      - name: Verify Cloudflare MASQUE Android engine
        shell: bash
        run: |
          set -euo pipefail
          AAR="admin-app/app/libs/effectcraft-warp-masque.aar"
          test -s "$AAR"
          unzip -tq "$AAR"
          unzip -p "$AAR" classes.jar > "$RUNNER_TEMP/warp-admin-classes.jar"
          jar tf "$RUNNER_TEMP/warp-admin-classes.jar" | grep -E 'com/effectcraft/warp/.*\.class'
          unzip -l "$AAR" | grep -E 'jni/arm64-v8a/.*\.so'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set +o pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER_DIR="$(dirname "$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)")"
          test -x "$SDKMANAGER_DIR/sdkmanager"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER_DIR/sdkmanager" --licenses >/dev/null
          set -o pipefail

      - name: Install Android build components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust for Android arm64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cargo/bin"
          ARCHIVE="$RUNNER_TEMP/cargo-ndk-v4.1.2.tgz"
          if curl -fL --retry 2 --retry-all-errors --retry-delay 3 \
            "https://github.com/bbqsrc/cargo-ndk/releases/download/v4.1.2/cargo-ndk-x86_64-unknown-linux-musl-v4.1.2.tgz" \
            -o "$ARCHIVE"; then
            tar -xzf "$ARCHIVE" --strip-components=1 -C "$HOME/.cargo/bin"
          else
            cargo install cargo-ndk --version 4.1.2 --locked
          fi
          chmod +x "$HOME/.cargo/bin/cargo-ndk"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cargo ndk -V

      - name: Build the native public P2P node
        working-directory: p2p-bridge
        run: |
          cargo ndk -t arm64-v8a -o ../admin-app/app/src/main/jniLibs build --release
          test -s ../admin-app/app/src/main/jniLibs/arm64-v8a/libeffectcraft_p2p.so

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Keep the Android debug certificate stable between builds so users can
      # install updates without uninstalling the app or losing local accounts.
      - name: Restore persistent Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: effectcraft-admin-debug-signing-v1-${{ github.repository_id }}

      - name: Ensure the restored debug signing key exists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -s "$HOME/.android/debug.keystore" ]]; then
            echo "No cached account-manager signing key was found; creating the first persistent key."
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=EffectCraft Account Admin, OU=Android, O=EffectCraft, C=US"
          fi
          test -s "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          echo "Persistent admin APK signing key is ready."

      - name: Verify Ae branding and task-scoped admin VPN source
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="admin-app/app/src/main/AndroidManifest.xml"
          ACTIVITY="admin-app/app/src/main/java/com/qianqian/effectcraftadmin/MainActivity.java"
          VPN="admin-app/app/src/main/java/com/qianqian/effectcraftadmin/AdminAccountVpnService.java"
          API="admin-app/app/src/main/java/com/qianqian/effectcraftadmin/CloudflareProxyPool.java"
          grep -Fq 'android:label="Ae账号管理"' "$MANIFEST"
          grep -Fq 'text("Ae账号管理"' "$ACTIVITY"
          if grep -R -n 'AE账号管理' admin-app/app/src/main; then
            echo "Branding must use Ae, not AE." >&2
            exit 1
          fi
          grep -Fq 'extends VpnService' "$VPN"
          grep -Fq 'AdminAccountVpnService.startForTask' "$API"
          grep -Fq 'AdminAccountVpnService.stopForTask' "$API"
          grep -Fq 'AdminAccountVpnService' "$MANIFEST"
          grep -Fq 'Proxy.NO_PROXY' "$API"
          grep -Fq 'com.effectcraft.warp.Warpandroid' "$VPN"
          if grep -R -n -E 'TProxyService|hev\\.socks5|公开代理' admin-app/app/src/main/java; then
            echo "Legacy proxy-relay VPN code must not remain in the admin APK." >&2
            exit 1
          fi
          echo "Verified exact Ae账号管理 branding and direct Cloudflare MASQUE VPN wiring."

      - name: Build admin APK
        env:
          AE_ACCOUNT_API_URL: ${{ vars.AE_ACCOUNT_API_URL || 'https://ae-cloud-account-api.q1939023856.workers.dev' }}
        working-directory: admin-app
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'lib/arm64-v8a/libeffectcraft_p2p.so'
          NATIVE_COUNT="$(unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/' | grep '\\.so          echo "Additional packaged native libraries: $NATIVE_COUNT"
          test "$NATIVE_COUNT" -ge 1
          cp app/build/outputs/apk/debug/app-debug.apk ../EffectCraft-Account-Admin.apk

      - name: Verify APK package integrity
        run: |
          unzip -t EffectCraft-Account-Admin.apk
          file EffectCraft-Account-Admin.apk
          ls -lh EffectCraft-Account-Admin.apk

      - name: Verify APK signer matches persistent admin key
        shell: bash
        run: |
          set -euo pipefail
          APK="EffectCraft-Account-Admin.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/admin-apk-signature.txt"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > "$RUNNER_TEMP/admin-key-certificate.txt"
          EXPECTED="$(awk -F': ' '/SHA256:/{gsub(/:/,"",$2); print tolower($2); exit}' "$RUNNER_TEMP/admin-key-certificate.txt")"
          ACTUAL="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{gsub(/:/,"",$2); print tolower($2); exit}' "$RUNNER_TEMP/admin-apk-signature.txt")"
          echo "Persistent key certificate SHA-256: $EXPECTED"
          echo "APK signer certificate SHA-256:    $ACTUAL"
          test -n "$EXPECTED" && test -n "$ACTUAL"
          test "$EXPECTED" = "$ACTUAL" || {
            echo "APK is not signed with the persistent account-manager key." >&2
            exit 1
          }

      # Explicitly save the debug signing identity after the first successful
      # build so future admin APK updates use the same certificate.
      - name: Save persistent Android debug signing key
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: effectcraft-admin-debug-signing-v1-${{ github.repository_id }}

      - name: Publish downloadable APK release asset
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: account-admin-${{ github.run_number }}
          name: EffectCraft Account Admin APK ${{ github.run_number }}
          draft: false
          prerelease: true
          files: EffectCraft-Account-Admin.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload backup build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EffectCraft-Account-Admin-APK
          path: EffectCraft-Account-Admin.apk
          if-no-files-found: error
          retention-days: 30
 | grep -vF 'lib/arm64-v8a/libeffectcraft_p2p.so' | grep -q .
          cp app/build/outputs/apk/debug/app-debug.apk ../EffectCraft-Account-Admin.apk

      - name: Verify APK package integrity
        run: |
          unzip -t EffectCraft-Account-Admin.apk
          file EffectCraft-Account-Admin.apk
          ls -lh EffectCraft-Account-Admin.apk

      - name: Verify APK signer matches persistent admin key
        shell: bash
        run: |
          set -euo pipefail
          APK="EffectCraft-Account-Admin.apk"

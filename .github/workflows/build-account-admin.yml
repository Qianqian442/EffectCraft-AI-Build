name: Build EffectCraft Account Admin APK

on:
  push:
    branches: [main]
    paths:
      - 'admin-app/**'
      - 'p2p-bridge/**'
      - '.github/workflows/build-account-admin.yml'
  pull_request:
    branches: [main]
    paths:
      - 'admin-app/**'
      - '.github/workflows/build-account-admin.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: effectcraft-account-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-admin:
    name: Build standalone account manager APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: 27.2.12479018

      - name: Set up Rust for Android arm64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build the native public P2P node
        working-directory: p2p-bridge
        run: |
          cargo ndk -t arm64-v8a -o ../admin-app/app/src/main/jniLibs build --release
          test -s ../admin-app/app/src/main/jniLibs/arm64-v8a/libeffectcraft_p2p.so

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Keep the Android debug certificate stable between builds so users can
      # install updates without uninstalling the app or losing local accounts.
      - name: Restore persistent Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: effectcraft-admin-debug-signing-v1-${{ github.repository_id }}

      - name: Build admin APK
        env:
          AE_ACCOUNT_API_URL: ${{ vars.AE_ACCOUNT_API_URL }}
        working-directory: admin-app
        run: |
          gradle --no-daemon :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'lib/arm64-v8a/libeffectcraft_p2p.so'
          cp app/build/outputs/apk/debug/app-debug.apk ../EffectCraft-Account-Admin.apk

      - name: Verify APK package integrity
        run: |
          unzip -t EffectCraft-Account-Admin.apk
          file EffectCraft-Account-Admin.apk
          ls -lh EffectCraft-Account-Admin.apk

      - name: Publish downloadable APK release asset
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: account-admin-${{ github.run_number }}
          name: EffectCraft Account Admin APK ${{ github.run_number }}
          draft: false
          prerelease: true
          files: EffectCraft-Account-Admin.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload backup build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EffectCraft-Account-Admin-APK
          path: EffectCraft-Account-Admin.apk
          if-no-files-found: error
          retention-days: 30

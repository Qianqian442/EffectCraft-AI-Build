name: Build EffectCraft Windows Compatibility Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/windows-plugin-runtime
    paths:
      - 'windows-compat/runtime-manifest.json'
      - 'windows-compat/aexlo-host/**'
      - 'windows-compat/tools/**'
      - '.github/workflows/build-windows-compat-runtime.yml'

permissions:
  contents: read

concurrency:
  group: effectcraft-windows-compat-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  box64-android:
    name: Build Android ARM64 Box64 backend
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out EffectCraft compatibility configuration
        uses: actions/checkout@v4

      - name: Check out pinned Box64 source
        uses: actions/checkout@v4
        with:
          repository: ptitSeb/box64
          ref: 4dbba1300a8d74c7c385f0d8a4e453c740622f9f
          path: third_party/box64
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make ninja-build python3 wget unzip file zstd

      - name: Install Android NDK r26b
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip -O "$RUNNER_TEMP/android-ndk.zip"
          unzip -q "$RUNNER_TEMP/android-ndk.zip" -d "$RUNNER_TEMP"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-r26b" >> "$GITHUB_ENV"

      - name: Configure Box64 for Android Bionic ARM64
        run: |
          NDK_COMPILER="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang"
          cmake -S third_party/box64 -B build/box64-android-arm64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$NDK_COMPILER" \
            -DANDROID=1 -DARM64=1 -DARM_DYNAREC=1 -DBAD_SIGNAL=1 \
            -DNO_CONF_INSTALL=ON -DNO_LIB_INSTALL=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage/box64"

      - name: Compile Box64
        run: |
          cmake --build build/box64-android-arm64 --parallel 2
          test -s build/box64-android-arm64/box64
          file build/box64-android-arm64/box64
          mkdir -p stage/box64/usr/bin
          install -m 0755 build/box64-android-arm64/box64 stage/box64/usr/bin/box64
          cp third_party/box64/LICENSE stage/box64/BOX64-LICENSE

      - name: Package Box64 Android ARM64 runtime component
        run: |
          mkdir -p artifacts
          tar --zstd -cf artifacts/box64-android-arm64.tar.zst -C stage/box64 .
          sha256sum artifacts/box64-android-arm64.tar.zst > artifacts/box64-android-arm64.tar.zst.sha256

      - name: Upload Box64 component
        uses: actions/upload-artifact@v4
        with:
          name: EffectCraft-Box64-Android-ARM64
          path: artifacts/*
          retention-days: 30

  fexcore-arm64ec:
    name: Build current upstream FEX ARM64EC and WoW64 PE backends
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Check out EffectCraft compatibility configuration
        uses: actions/checkout@v4

      - name: Check out pinned FEX source
        uses: actions/checkout@v4
        with:
          repository: FEX-Emu/FEX
          ref: ea43314f040633c76fb5891ff31d8a7c3dc533b8
          path: third_party/FEX
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build 64-bit Arm64EC FEXCore DLL
        working-directory: third_party/FEX
        run: |
          mkdir -p ../../build-fex/arm64ec
          cd ../../build-fex/arm64ec
          ../../third_party/FEX/Data/nix/cmake_configure_woa64.sh ../../third_party/FEX -G Ninja -DTUNE_CPU=none
          ninja

      - name: Build 32-bit WoW64 FEXCore DLL
        working-directory: third_party/FEX
        run: |
          mkdir -p ../../build-fex/wow64
          cd ../../build-fex/wow64
          ../../third_party/FEX/Data/nix/cmake_configure_woa32.sh ../../third_party/FEX -G Ninja -DTUNE_CPU=none
          ninja

      - name: Validate FEX PE machine types and Wine CPU exports
        working-directory: third_party/FEX
        run: |
          python3 -m venv "$RUNNER_TEMP/pefile-venv"
          source "$RUNNER_TEMP/pefile-venv/bin/activate"
          python -m pip install --disable-pip-version-check pefile
          python - <<'PY'
          import pefile
          from pathlib import Path

          checks = [
              (Path("../../build-fex/arm64ec/Bin/libarm64ecfex.dll"), 0xA641,
               {"BTCpu64FlushInstructionCache", "ProcessInit", "ThreadInit"}),
              (Path("../../build-fex/wow64/Bin/libwow64fex.dll"), 0xAA64,
               {"BTCpuProcessInit", "BTCpuThreadInit", "BTCpuSimulate"}),
          ]
          for path, expected_machine, required in checks:
              pe = pefile.PE(str(path), fast_load=False)
              machine = pe.FILE_HEADER.Machine
              exports = {
                  item.name.decode("ascii", "replace")
                  for item in pe.DIRECTORY_ENTRY_EXPORT.symbols
                  if item.name
              }
              missing = sorted(required - exports)
              if machine != expected_machine:
                  raise SystemExit(f"{path}: machine 0x{machine:04x}, expected 0x{expected_machine:04x}")
              if missing:
                  raise SystemExit(f"{path}: missing expected Wine CPU exports: {missing}")
              print(f"{path}: PE machine=0x{machine:04x}; required exports present")
          PY

      - name: Package FEXCore runtime components
        run: |
          set -euo pipefail
          test -s build-fex/arm64ec/Bin/libarm64ecfex.dll
          test -s build-fex/wow64/Bin/libwow64fex.dll
          mkdir -p artifacts/fexcore/system32
          install -m 0644 build-fex/arm64ec/Bin/libarm64ecfex.dll artifacts/fexcore/system32/
          install -m 0644 build-fex/wow64/Bin/libwow64fex.dll artifacts/fexcore/system32/
          cp third_party/FEX/LICENSE artifacts/fexcore/FEX-LICENSE
          printf '%s\\n' 'FEX-Emu/FEX' 'ea43314f040633c76fb5891ff31d8a7c3dc533b8' > artifacts/fexcore/FEX-SOURCE.txt
          sha256sum artifacts/fexcore/system32/*.dll > artifacts/fexcore/DLL-SHA256SUMS.txt
          tar --zstd -cf artifacts/fexcore-arm64ec.tar.zst -C artifacts/fexcore .
          sha256sum artifacts/fexcore-arm64ec.tar.zst > artifacts/fexcore-arm64ec.tar.zst.sha256

      - name: Upload FEXCore components
        uses: actions/upload-artifact@v4
        with:
          name: EffectCraft-FEXCore-Arm64EC-WoW64-CurrentMain
          path: artifacts/fexcore-arm64ec.tar.zst*
          retention-days: 30

  aexlo-windows-host:
    name: Build AE plug-in host worker (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out EffectCraft compatibility configuration
        uses: actions/checkout@v4

      - name: Check out pinned aexlo source and license
        uses: actions/checkout@v4
        with:
          repository: potistudio/aexlo
          ref: 32c3fe399bc7d2deb3e5f9a02c627db50d8e7ff9
          path: third_party/aexlo

      - name: Set up Rust stable for Windows MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Generate locked dependency graph and compile AE host
        run: |
          cargo generate-lockfile --manifest-path windows-compat/aexlo-host/Cargo.toml
          cargo build --locked --release --target x86_64-pc-windows-msvc --manifest-path windows-compat/aexlo-host/Cargo.toml
          if (!(Test-Path "windows-compat/aexlo-host/target/x86_64-pc-windows-msvc/release/effectcraft-aex-host.exe")) { throw "AEX host worker executable was not produced" }

      - name: Build the upstream aexlo Noise sample plug-in (Windows x64)
        run: |
          cargo build --manifest-path third_party/aexlo/examples/plugins/noise/Cargo.toml --release --target x86_64-pc-windows-msvc
          if (!(Test-Path "third_party/aexlo/target/x86_64-pc-windows-msvc/release/aexlo_demo_noise.dll")) { throw "aexlo sample AEX DLL was not produced" }

      - name: Independently audit the sample PE with LIEF
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check lief
          python windows-compat/tools/pe_audit.py third_party/aexlo/target/x86_64-pc-windows-msvc/release/aexlo_demo_noise.dll --output artifacts/lief-pe-audit.json

      - name: Smoke-test AE plug-in loading and CPU frame rendering
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item "third_party/aexlo/target/x86_64-pc-windows-msvc/release/aexlo_demo_noise.dll" "artifacts/aexlo_demo_noise.aex"
          $request = @{
            cmd = "render"
            input_png = "third_party/aexlo/fixtures/input.png"
            output_png = "artifacts/aexlo-demo-noise-render.png"
            frame = 0
            fps = 30
          } | ConvertTo-Json -Compress
          @($request, '{"cmd":"quit"}') | Set-Content -Encoding ascii "artifacts/worker-requests.jsonl"
          $hostExe = (Resolve-Path "windows-compat/aexlo-host/target/x86_64-pc-windows-msvc/release/effectcraft-aex-host.exe").Path
          $plugin = (Resolve-Path "artifacts/aexlo_demo_noise.aex").Path
          $inputFile = (Resolve-Path "artifacts/worker-requests.jsonl").Path
          $outputFile = Join-Path $PWD "artifacts/worker-output.jsonl"
          $errorFile = Join-Path $PWD "artifacts/worker-error.log"
          $process = Start-Process -FilePath $hostExe -ArgumentList @($plugin) -NoNewWindow -Wait -PassThru -RedirectStandardInput $inputFile -RedirectStandardOutput $outputFile -RedirectStandardError $errorFile
          if ($process.ExitCode -ne 0) { Get-Content $errorFile -ErrorAction SilentlyContinue; throw "aexlo host worker exited with $($process.ExitCode)" }
          $lines = Get-Content $outputFile
          if ($lines.Count -lt 2) { throw "aexlo host worker did not return plug-in metadata and render response" }
          $info = $lines[0] | ConvertFrom-Json
          $render = $lines[1] | ConvertFrom-Json
          if (-not $info.ok) { throw "AEX plug-in load failed: $($lines[0])" }
          if (-not $render.ok) { throw "AEX sample render failed: $($lines[1])" }
          if (-not (Test-Path "artifacts/aexlo-demo-noise-render.png")) { throw "render output image was not created" }
          Write-Host "AEX host smoke test passed: $($info.about); output $($render.width)x$($render.height)"
          $lines | Set-Content -Encoding utf8 "artifacts/worker-output.jsonl"

      - name: Package AE host worker and notices
        shell: pwsh
        run: |
          Copy-Item "windows-compat/aexlo-host/target/x86_64-pc-windows-msvc/release/effectcraft-aex-host.exe" "artifacts/"
          Copy-Item "third_party/aexlo/LICENSE" "artifacts/AEXLO-MIT-LICENSE"
          Get-FileHash "artifacts/effectcraft-aex-host.exe" -Algorithm SHA256 | Format-List | Out-File "artifacts/SHA256.txt"

      - name: Upload AE host worker
        uses: actions/upload-artifact@v4
        with:
          name: EffectCraft-AE-Host-Windows-x64
          path: artifacts/*
          retention-days: 30

name: Verify EffectCraft account manager update signature

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-admin-signature-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-signing-certificate:
    name: Compare Build 154 and Build 156 APK certificates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Configure Android build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install "platform-tools" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Download administrator APK candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/admin-signature-check"
          for VERSION in 154 156 162; do
            curl -fL --retry 4 --retry-all-errors \
              "https://github.com/Qianqian442/EffectCraft-AI-Build/releases/download/account-admin-$VERSION/EffectCraft-Account-Admin.apk" \
              -o "$RUNNER_TEMP/admin-signature-check/build-$VERSION.apk"
            test -s "$RUNNER_TEMP/admin-signature-check/build-$VERSION.apk"
          done

      - name: Compare APK signing certificates
        shell: bash
        run: |
          set -euo pipefail
          TOOL="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          for VERSION in 154 156 162; do
            "$TOOL" verify --verbose --print-certs "$RUNNER_TEMP/admin-signature-check/build-$VERSION.apk" > "$RUNNER_TEMP/admin-signature-check/$VERSION.txt"
            CERT="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{gsub(/:/,"",$2); print tolower($2); exit}' "$RUNNER_TEMP/admin-signature-check/$VERSION.txt")"
            test -n "$CERT"
            echo "Build $VERSION signer SHA-256: $CERT"
          done
          CERT154="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{gsub(/:/,"",$2); print tolower($2); exit}' "$RUNNER_TEMP/admin-signature-check/154.txt")"
          CERT156="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{gsub(/:/,"",$2); print tolower($2); exit}' "$RUNNER_TEMP/admin-signature-check/156.txt")"
          CERT162="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{gsub(/:/,"",$2); print tolower($2); exit}' "$RUNNER_TEMP/admin-signature-check/162.txt")"
          [[ "$CERT154" == "$CERT156" ]] && echo "154 -> 156: compatible update" || echo "::notice::154 -> 156: signatures differ; reinstall required"
          [[ "$CERT156" == "$CERT162" ]] && echo "156 -> 162: compatible update" || echo "::notice::156 -> 162: signatures differ; reinstall required"
          [[ "$CERT154" == "$CERT162" ]] && echo "154 -> 162: compatible update" || echo "::notice::154 -> 162: signatures differ; reinstall required"

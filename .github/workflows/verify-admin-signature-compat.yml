name: Verify EffectCraft account manager update signature

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-admin-signature-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-signing-certificate:
    name: Compare installed Build 163 and tested Build 189 APK certificates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Configure Android build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install "platform-tools" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Download administrator APK candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/admin-signature-check"
          for VERSION in 163 189; do
            curl -fL --retry 4 --retry-all-errors \
              "https://github.com/Qianqian442/EffectCraft-AI-Build/releases/download/account-admin-$VERSION/EffectCraft-Account-Admin.apk" \
              -o "$RUNNER_TEMP/admin-signature-check/build-$VERSION.apk"
            test -s "$RUNNER_TEMP/admin-signature-check/build-$VERSION.apk"
          done

      - name: Compare APK signing certificates
        shell: bash
        run: |
          set -euo pipefail
          TOOL="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          for VERSION in 163 189; do
            "$TOOL" verify --verbose --print-certs "$RUNNER_TEMP/admin-signature-check/build-$VERSION.apk" > "$RUNNER_TEMP/admin-signature-check/$VERSION.txt"
            CERT="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{gsub(/:/,"",$2); print tolower($2); exit}' "$RUNNER_TEMP/admin-signature-check/$VERSION.txt")"
            test -n "$CERT"
            echo "Build $VERSION signer SHA-256: $CERT"
          done
          CERT163="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{gsub(/:/,"",$2); print tolower($2); exit}' "$RUNNER_TEMP/admin-signature-check/163.txt")"
          CERT189="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{gsub(/:/,"",$2); print tolower($2); exit}' "$RUNNER_TEMP/admin-signature-check/189.txt")"
          echo "Build 163 signer SHA-256: $CERT163"
          echo "Build 189 signer SHA-256: $CERT189"
          if [[ "$CERT163" != "$CERT189" ]]; then
            echo "::error::Build 189 is not signed with the installed Build 163 certificate. Do not install it over Build 163."
            exit 1
          fi
          echo "Certificate match confirmed: Build 189 can be installed over Build 163 without uninstalling the app or deleting local SQLite data."

name: Deploy Ae Cloud Account API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ae-cloud-account-api-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply D1 schema and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply account database schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$JWT_SECRET" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "Missing GitHub Actions secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, JWT_SECRET, ADMIN_PASSWORD" >&2
            exit 1
          fi
          if [ "${#JWT_SECRET}" -lt 32 ] || [ "${#ADMIN_PASSWORD}" -lt 12 ]; then
            echo "JWT_SECRET must be at least 32 characters and ADMIN_PASSWORD at least 12 characters." >&2
            exit 1
          fi
          npx --yes wrangler@4 d1 execute ae-accounts --remote --file=./schema.sql --yes

      - name: Deploy Worker
        id: deploy_worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          LOG_FILE="$RUNNER_TEMP/ae-worker-deploy.log"
          npx --yes wrangler@4 deploy 2>&1 | tee "$LOG_FILE"
          WORKER_URL="$(grep -Eo 'https://ae-cloud-account-api\\.[A-Za-z0-9-]+\\.workers\\.dev' "$LOG_FILE" | tail -n 1 || true)"
          if [ -z "$WORKER_URL" ]; then
            echo "::error::Deployment output did not include the workers.dev URL. Check whether workers.dev is enabled for this Cloudflare account."
            exit 1
          fi
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "Worker URL: $WORKER_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Worker runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          printf '%s' "$JWT_SECRET" | npx --yes wrangler@4 secret put JWT_SECRET
          printf '%s' "$ADMIN_PASSWORD" | npx --yes wrangler@4 secret put ADMIN_PASSWORD

      - name: Verify Worker and D1 health
        env:
          WORKER_URL: ${{ steps.deploy_worker.outputs.worker_url }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 3 "$WORKER_URL/health")"
          printf '%s\\n' "$RESPONSE"
          printf '%s' "$RESPONSE" | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const health = JSON.parse(input); if (health.ok !== true || health.database !== true) process.exit(1); });'
          echo "Cloud Worker and D1 are responding successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "API base URL: $WORKER_URL" >> "$GITHUB_STEP_SUMMARY"

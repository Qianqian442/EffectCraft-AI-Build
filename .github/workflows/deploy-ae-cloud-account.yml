name: Deploy Ae Cloud Account API

on:
  push:
    branches: [main, 'experiment/windows-plugin-runtime']
    paths:
      - '.github/workflows/deploy-ae-cloud-account.yml'
      - 'cloudflare-worker/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ae-cloud-account-api-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply D1 schema and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Normalize Cloudflare API token formatting
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$RAW_CLOUDFLARE_API_TOKEN" | tr -d '\r\n')"
          TOKEN="${TOKEN#"${TOKEN%%[![:space:]]*}"}"
          TOKEN="${TOKEN%"${TOKEN##*[![:space:]]}"}"
          case "$TOKEN" in
            Authorization:\ Bearer\ *) TOKEN="${TOKEN#Authorization: Bearer }" ;;
            authorization:\ bearer\ *) TOKEN="${TOKEN#authorization: bearer }" ;;
            Bearer\ *) TOKEN="${TOKEN#Bearer }" ;;
            bearer\ *) TOKEN="${TOKEN#bearer }" ;;
          esac
          if [[ "$TOKEN" == \"*\" && "$TOKEN" == *\" ]]; then
            TOKEN="${TOKEN#\"}"
            TOKEN="${TOKEN%\"}"
          elif [[ "$TOKEN" == \'*\' && "$TOKEN" == *\' ]]; then
            TOKEN="${TOKEN#\'}"
            TOKEN="${TOKEN%\'}"
          fi
          if [ -z "$TOKEN" ] || [[ "$TOKEN" == *[[:space:]]* ]] || [[ ! "$TOKEN" =~ ^[A-Za-z0-9._~+/=-]+$ ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not in raw API-token format. Save only the token characters, without Authorization/Bearer text or surrounding quotes."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Apply account database schema
        env:
          CLOUDFLARE_ACCOUNT_ID: 6ed9bd81b9aef69ba61060f33510f014
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$JWT_SECRET" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "::error::Missing one or more required repository Actions secrets: CLOUDFLARE_API_TOKEN, JWT_SECRET, ADMIN_PASSWORD"
            exit 1
          fi
          if [ "${#JWT_SECRET}" -lt 32 ] || [ "${#ADMIN_PASSWORD}" -lt 12 ]; then
            echo "::error::JWT_SECRET must be at least 32 characters and ADMIN_PASSWORD at least 12 characters."
            exit 1
          fi
          npx --yes wrangler@4 d1 execute ae-accounts --remote --file=./schema.sql --yes

      - name: Deploy Worker
        id: deploy_worker
        env:
          CLOUDFLARE_ACCOUNT_ID: 6ed9bd81b9aef69ba61060f33510f014
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy
          # Fixed workers.dev URL confirmed by the successful Cloudflare deployment.
          WORKER_URL="https://ae-cloud-account-api.q1939023856.workers.dev"
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "Worker URL: $WORKER_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Worker runtime secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: 6ed9bd81b9aef69ba61060f33510f014
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$JWT_SECRET" | npx --yes wrangler@4 secret put JWT_SECRET
          printf '%s' "$ADMIN_PASSWORD" | npx --yes wrangler@4 secret put ADMIN_PASSWORD

      - name: Verify Worker and D1 health
        id: health
        env:
          WORKER_URL: ${{ steps.deploy_worker.outputs.worker_url }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 3 "$WORKER_URL/health")"
          printf '%s\n' "$RESPONSE"
          printf '%s' "$RESPONSE" | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const health = JSON.parse(input); if (health.ok !== true || health.database !== true) process.exit(1); });'
          echo "Cloud Worker and D1 are responding successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "API base URL: $WORKER_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify administrator account count and cloud server switch
        env:
          WORKER_URL: ${{ steps.deploy_worker.outputs.worker_url }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = process.env.WORKER_URL;
          const password = process.env.ADMIN_PASSWORD;
          const request = async (path, options = {}) => {
            const response = await fetch(base + path, options);
            const data = await response.json();
            if (!response.ok) throw new Error(path + " returned HTTP " + response.status);
            return data;
          };
          const login = await request("/v1/admin/login", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ username: "admin", password })
          });
          if (!login.token) throw new Error("Cloud administrator login returned no token");
          const headers = { authorization: "Bearer " + login.token };
          const [accounts, server] = await Promise.all([
            request("/v1/admin/users", { headers }),
            request("/v1/admin/server", { headers })
          ]);
          if (!Number.isInteger(accounts.total_count) || accounts.total_count < 0) {
            throw new Error("Cloud admin API did not return an exact total account count");
          }
          if (typeof server.enabled !== "boolean") {
            throw new Error("Cloud admin API did not return the account server switch state");
          }
          const saved = await request("/v1/admin/server", {
            method: "POST",
            headers: { ...headers, "content-type": "application/json" },
            body: JSON.stringify({ enabled: server.enabled })
          });
          if (saved.enabled !== server.enabled) {
            throw new Error("Cloud server switch did not persist its current state");
          }
          console.log("Administrator login, exact account count, and cloud server switch APIs passed.");
          console.log("Registered account total: " + accounts.total_count);
          console.log("Cloud account service enabled: " + server.enabled);
          NODE

      - name: Record the shared cloud account API endpoint
        env:
          WORKER_URL: ${{ steps.deploy_worker.outputs.worker_url }}
        run: |
          echo "Shared cloud account API: $WORKER_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Admin login, exact account count and cloud server switch checks passed." >> "$GITHUB_STEP_SUMMARY"
          echo "Both APK workflows use this deployed URL as their built-in fallback." >> "$GITHUB_STEP_SUMMARY"

# Re-run deployment after required repository secrets are configured.

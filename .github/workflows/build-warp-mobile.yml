name: Build EffectCraft Cloudflare MASQUE Android core

on:
  push:
    branches: [feature/own-on-demand-vpn, feature/main-cloudflare-warp-vpn]
    paths:
      - 'warp-mobile/**'
      - '.github/scripts/patch_usque_for_android.py'
      - '.github/workflows/build-warp-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: effectcraft-warp-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-masque-aar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out EffectCraft
        uses: actions/checkout@v4
      - name: Set up Go 1.26.3
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set +o pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER_DIR="$(dirname "$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)")"
          test -x "$SDKMANAGER_DIR/sdkmanager"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER_DIR/sdkmanager" --licenses >/dev/null
          set -o pipefail
      - name: Install pinned Android NDK
        run: sdkmanager --install "ndk;27.2.12479018"
      - name: Configure Android NDK
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Initialize gomobile
        run: gomobile init
      - name: Build ARM64 Android AAR
        run: |
          chmod +x warp-mobile/build-android-aar.sh
          warp-mobile/build-android-aar.sh
      - name: Inspect AAR ABI and Java bindings
        run: |
          unzip -l warp-mobile/build/effectcraft-warp-masque.aar
          unzip -p warp-mobile/build/effectcraft-warp-masque.aar classes.jar > "$RUNNER_TEMP/warp-classes.jar"
          jar tf "$RUNNER_TEMP/warp-classes.jar" | grep -E 'com/effectcraft/warp|warpandroid'
      - name: Upload MASQUE AAR prototype
        uses: actions/upload-artifact@v4
        with:
          name: EffectCraft-Cloudflare-MASQUE-ARM64-AAR
          path: warp-mobile/build/effectcraft-warp-masque.aar
          if-no-files-found: error
          retention-days: 14

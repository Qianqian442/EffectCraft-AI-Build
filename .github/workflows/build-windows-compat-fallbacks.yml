name: Build EffectCraft Windows Compatibility Fallbacks

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/windows-plugin-runtime
    paths:
      - 'windows-compat/runtime-manifest.json'
      - 'windows-compat/tools/**'
      - '.github/workflows/build-windows-compat-fallbacks.yml'

permissions:
  contents: read

concurrency:
  group: effectcraft-windows-compat-fallbacks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qemu-user-android:
    name: Build QEMU x86-64 Linux user-mode fallback for Android
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Check out Termux Android package recipes
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: master
          path: third_party/termux-packages

      - name: Patch Termux QEMU recipe to build only x86-64 Linux-user emulation
        working-directory: third_party/termux-packages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          recipe = Path("packages/qemu-system-x86-64-headless/build.sh")
          source = recipe.read_text()
          start = source.index('\tlocal QEMU_TARGETS=""')
          end = source.index('\n\tCFLAGS+=', start)
          source = source[:start] + '''\t# EffectCraft uses QEMU only as an x86-64 Linux-user fallback for Wine.
          \t# Avoid softmmu/system-emulation targets and their device-tree dependencies.
          \tlocal QEMU_TARGETS="x86_64-linux-user"
          ''' + source[end:]
          source = source.replace('alsa-lib, dtc, glib,', 'glib,')
          # This is Linux-user emulation only. Do not build/ship audio servers,
          # devices or multimedia backends for the fallback package.
          for dependency in (
              "jack2, ", "libspice-server, ", "libusb, ",
              "libusbredir, ", "ncurses, ", "pulseaudio, ",
          ):
              source = source.replace(dependency, "")
          source = source.replace('--enable-fdt=system', '--disable-fdt')
          source = source.replace('--audio-drv-list=pa', '--audio-drv-list=')
          source = source.replace('--enable-curses', '--disable-curses')
          source = source.replace('--enable-vnc', '--disable-vnc')
          source = source.replace('--enable-virtfs', '--disable-virtfs')
          source = source.replace('--enable-spice', '--disable-spice')
          source = source.replace('--enable-libusb', '--disable-libusb')
          source = source.replace('--enable-usb-redir', '--disable-usb-redir')
          recipe.write_text(source)
          print("Patched QEMU to x86_64-linux-user only; DTC and system emulation disabled.")
          PY

      - name: Build Android PRoot helper
        working-directory: third_party/termux-packages
        run: |
          set -euo pipefail
          sudo ./scripts/run-docker.sh ./build-package.sh -a aarch64 proot

      - name: Build Android QEMU x86-64 Linux-user package
        working-directory: third_party/termux-packages
        run: |
          set -euo pipefail
          sudo ./scripts/run-docker.sh ./build-package.sh -a aarch64 qemu-system-x86-64-headless

      - name: Collect QEMU user-mode and PRoot packages
        working-directory: third_party/termux-packages
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/artifacts/qemu"
          find output -type f -name 'qemu-user-x86-64*.deb' -exec cp -t "${GITHUB_WORKSPACE}/artifacts/qemu/" {} +
          find output -type f -name 'proot_*.deb' -exec cp -t "${GITHUB_WORKSPACE}/artifacts/qemu/" {} +
          find output -type f -name 'qemu-system-x86-64-headless*.deb' -exec cp -t "${GITHUB_WORKSPACE}/artifacts/qemu/" {} +
          test -n "$(find "${GITHUB_WORKSPACE}/artifacts/qemu" -name 'qemu-user-x86-64*.deb' -print -quit)"
          dpkg-deb -I "${GITHUB_WORKSPACE}"/artifacts/qemu/qemu-user-x86-64*.deb
          sha256sum "${GITHUB_WORKSPACE}"/artifacts/qemu/* > "${GITHUB_WORKSPACE}/artifacts/qemu/SHA256SUMS.txt"

      - name: Upload Android QEMU fallback components
        uses: actions/upload-artifact@v4
        with:
          name: EffectCraft-QEMU-x86-64-Android-Fallback
          path: artifacts/qemu/*
          retention-days: 30

  clvk-opencl-android:
    name: Build Android ARM64 CLVK OpenCL-on-Vulkan backend
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out EffectCraft compatibility configuration
        uses: actions/checkout@v4

      - name: Check out pinned CLVK source
        uses: actions/checkout@v4
        with:
          repository: kpet/clvk
          ref: 5aa061c93c2d5a53b591e646ad359f2e5408b794
          path: third_party/clvk
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 wget unzip file

      - name: Install Android NDK r26b
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip -O "$RUNNER_TEMP/android-ndk.zip"
          unzip -q "$RUNNER_TEMP/android-ndk.zip" -d "$RUNNER_TEMP"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-r26b" >> "$GITHUB_ENV"

      - name: Fetch CLVK compiler support source dependencies
        working-directory: third_party/clvk/external/clspv
        run: python3 utils/fetch_sources.py --deps llvm --shallow

      - name: Guard optional shader-FMA feature unavailable in Android NDK Vulkan headers
        run: python3 windows-compat/tools/patch_clvk_android_headers.py third_party/clvk

      - name: Configure CLVK for Android ARM64 (precompiled SPIR-V mode)
        run: |
          NDK_SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          cmake -S third_party/clvk -B build/clvk-android-arm64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=28 \
            -DCLVK_VULKAN_IMPLEMENTATION=custom \
            -DVulkan_INCLUDE_DIRS="$NDK_SYSROOT/usr/include" \
            -DVulkan_LIBRARIES="$NDK_SYSROOT/usr/lib/aarch64-linux-android/28/libvulkan.so" \
            -DCLVK_COMPILER_AVAILABLE=OFF \
            -DCLVK_CLSPV_ONLINE_COMPILER=OFF \
            -DCLVK_BUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage/clvk"

      - name: Compile CLVK
        run: |
          cmake --build build/clvk-android-arm64 --target OpenCL --parallel 2
          test -s build/clvk-android-arm64/libOpenCL.so
          file build/clvk-android-arm64/libOpenCL.so

      - name: Package CLVK and notices
        run: |
          mkdir -p artifacts/clvk
          install -m 0644 build/clvk-android-arm64/libOpenCL.so artifacts/clvk/libOpenCL.so
          cp third_party/clvk/LICENSE artifacts/clvk/CLVK-APACHE-2.0-LICENSE
          cat > artifacts/clvk/BUILD-MODE.txt <<'EOF'
          Android ARM64 CLVK build with CLVK_COMPILER_AVAILABLE=OFF.
          Supports only precompiled SPIR-V / OpenCL IL flows.
          This build does not provide general OpenCL C runtime compilation.
          It does not implement CUDA.
          Wine OpenCL ICD bridging must be verified separately.
          EOF
          sha256sum artifacts/clvk/* > artifacts/clvk/SHA256SUMS.txt

      - name: Upload CLVK Android ARM64 component
        uses: actions/upload-artifact@v4
        with:
          name: EffectCraft-CLVK-Android-ARM64-Experimental
          path: artifacts/clvk/*
          retention-days: 30

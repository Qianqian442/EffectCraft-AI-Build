name: Validate EffectCraft Windows Plug-in Compatibility

on:
  push:
    branches:
      - experiment/windows-plugin-runtime
    paths:
      - '.github/scripts/add_desktop_plugin_package_support.py'
      - '.github/workflows/validate-windows-compat.yml'
      - 'windows-compat/runtime-manifest.json'
      - 'windows-compat/aexlo-host/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out compatibility experiment
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check out EffectCraft source
        uses: actions/checkout@v4
        with:
          repository: storytold/effectcraft
          ref: v0.21.1
          path: effectcraft

      - name: Validate Python patch source
        run: |
          python3 -m py_compile .github/scripts/add_desktop_plugin_package_support.py

      - name: Apply original plug-in import and ZIP patches before desktop migration patch
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/effectcraft
        run: |
          python3 .github/scripts/add_plugin_import_button.py
          python3 .github/scripts/add_zip_plugin_support.py
          python3 .github/scripts/add_desktop_plugin_package_support.py
          python3 .github/scripts/add_desktop_plugin_package_support.py
          grep -Fq 'fn windows_pe_metadata' effectcraft/crates/engine/src/cmd/effect.rs
          grep -Fq 'fn inspect_desktop_native_file' effectcraft/crates/engine/src/cmd/effect.rs
          grep -Fq 'return inspect_desktop_native_file(s, path)' effectcraft/crates/engine/src/cmd/effect.rs

      - name: Parse generated Rust source
        run: |
          rustup component add rustfmt
          rustfmt --edition 2024 --emit stdout effectcraft/crates/engine/src/cmd/effect.rs >/dev/null
          rustfmt --edition 2024 --emit stdout effectcraft/crates/ui-egui/src/header.rs >/dev/null

      - name: Type-check the patched EffectCraft engine
        working-directory: effectcraft
        run: cargo check --locked -p effectcraft-engine --lib

      - name: Check required runtime architecture and memory policy
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("windows-compat/runtime-manifest.json").read_text())
          assert manifest["target_abi"] == ["arm64-v8a"]
          assert manifest["memory_policy"]["application_imposed_ram_limit"] is False
          assert manifest["memory_policy"]["rlimit_as"] is False
          assert manifest["memory_policy"]["cgroup_memory_limit"] is False
          assert manifest["memory_policy"]["box64_artificial_memory_cap"] is False
          readme = Path("windows-compat/README.md").read_text()
          for item in ("Wine", "Box64", "Hangover", "AEX", "SmartFX", "AEGP", "no"):
              assert item.lower() in readme.lower(), item
          print("Windows compatibility manifest and no-app-RAM-cap policy validated.")
          PY

      - name: Check patch contains static PE inspection and single-file routing
        run: |
          grep -Fq 'fn windows_pe_metadata' .github/scripts/add_desktop_plugin_package_support.py
          grep -Fq 'fn inspect_desktop_native_file' .github/scripts/add_desktop_plugin_package_support.py
          grep -Fq 'return inspect_desktop_native_file(s, path)' .github/scripts/add_desktop_plugin_package_support.py
          echo "PE static analysis and direct native plug-in routing are present."

name: Validate EffectCraft Windows Plug-in Compatibility

on:
  push:
    branches:
      - experiment/windows-plugin-runtime
    paths:
      - '.github/scripts/add_desktop_plugin_package_support.py'
      - '.github/scripts/add_plugin_migration_progress.py'
      - '.github/scripts/integrate_windows_compat_runtime.py'
      - '.github/scripts/add_windows_runtime_ui.py'
      - '.github/scripts/windows_compat_android.rs'
      - '.github/workflows/validate-windows-compat.yml'
      - 'windows-compat/runtime-manifest.json'
      - 'windows-compat/aexlo-host/**'
      - 'windows-compat/android-runtime/**'
      - 'windows-compat/tools/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: effectcraft-windows-compat-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out compatibility experiment
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check out EffectCraft source
        uses: actions/checkout@v4
        with:
          repository: storytold/effectcraft
          ref: v0.21.1
          path: effectcraft

      - name: Check out ArtCraft Android builder
        uses: actions/checkout@v4
        with:
          repository: MostafaXS1/artcraft-android
          ref: v0.5.0
          path: artcraft

      - name: Validate Python patch source
        run: |
          python3 -m py_compile .github/scripts/add_desktop_plugin_package_support.py
          python3 -m py_compile .github/scripts/add_plugin_migration_progress.py
          python3 -m py_compile .github/scripts/integrate_windows_compat_runtime.py
          python3 -m py_compile .github/scripts/add_windows_runtime_ui.py
          python3 -m py_compile windows-compat/tools/pe_audit.py
          python3 -m py_compile windows-compat/tools/patch_box64_obstack_compat.py
          python3 -m py_compile windows-compat/tools/patch_box64_signal32_bionic.py
          python3 -m py_compile windows-compat/tools/patch_box64_threads32_bionic.py

      - name: Install actionlint
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Lint GitHub Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          "$HOME/go/bin/actionlint" -color \
            .github/workflows/validate-windows-compat.yml \
            .github/workflows/build-windows-compat-runtime.yml \
            .github/workflows/build-windows-compat-fallbacks.yml \
            .github/workflows/build-aexlo-x86-host.yml \
            .github/workflows/build-box64-box32-backend.yml

      - name: Set up Java for runtime selector checks
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle for Android runtime module
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK platform and build tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found in preinstalled Android SDK" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build and run Android runtime module host tests
        run: |
          gradle -p windows-compat/android-runtime testDebugUnitTest assembleRelease --no-daemon


      - name: Inspect current Winlator Box64EC, Box64, FEXCore and WowBox64 WCP profiles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/wcp-profiles
          inspect_wcp() {
            local name="$1" url="$2" expected_sha="$3" expected_size="$4"
            local archive="build/wcp-profiles/$name.wcp"
            curl -fL --retry 3 "$url" -o "$archive"
            echo "$expected_sha  $archive" | sha256sum -c -
            test "$(stat -c %s "$archive")" = "$expected_size"
            echo "===== $name: verified size=$(stat -c %s "$archive") sha256=$expected_sha ====="
            if tar --zstd -tf "$archive" >/dev/null 2>&1; then
              tar --zstd -xOf "$archive" profile.json
            elif tar -xJf "$archive" -O profile.json >/dev/null 2>&1; then
              tar -xJf "$archive" -O profile.json
            else
              echo "Unsupported WCP archive compression: $name" >&2
              file "$archive"
              exit 1
            fi
            echo
          }
          base="https://github.com/The412Banner/Nightlies/releases/download/nightly-20261112-230654"
          inspect_wcp "box64-bionic" "$base/Box64-0.4.5-78ffc6f64-Bionic.wcp" "77b0ef38b458c442dca8fc2ce9a4a14406a3ccc7781a701ef6ab199bb1abba98" "2834452"
          inspect_wcp "box64ec-experimental" "$base/Box64EC-0.4.5-52db1d07a-experimental.wcp" "5edfbf9f3fe6ab386fd351a359c0053e09653682125f91b7840a75f08a64a138" "1056532"
          inspect_wcp "wowbox64" "$base/WOWBox64-0.4.5-62de9d50b.wcp" "2d77fb8ea9fc00b8ae4a195b56d569cd8f43530f3a5b27fb55b5b616abe0c0db" "910864"
          stable="https://github.com/The412Banner/Nightlies/releases/download/FEXCore-2611.1/FEXCore-2611.1.wcp"
          inspect_wcp "fexcore-2611.1" "$stable" "60ef9fefd5a01e353d9266ddb2ad50317ff6f526bc0f42a96408651e373fa8b4" "1288148"

      - name: Apply original plug-in import and ZIP patches before desktop migration patch
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/effectcraft
        run: |
          python3 .github/scripts/add_plugin_import_button.py
          python3 .github/scripts/add_zip_plugin_support.py
          python3 .github/scripts/add_desktop_plugin_package_support.py
          python3 .github/scripts/add_desktop_plugin_package_support.py
          grep -Fq 'fn windows_pe_metadata' effectcraft/crates/engine/src/cmd/effect.rs
          grep -Fq 'fn inspect_desktop_native_file' effectcraft/crates/engine/src/cmd/effect.rs
          grep -Fq 'return inspect_desktop_native_file(s, path)' effectcraft/crates/engine/src/cmd/effect.rs

      - name: Generate AE migration UI and integrate Android Windows runtime
        env:
          ARTCRAFT_DIR: ${{ github.workspace }}/artcraft
          EFFECTCRAFT_DIR: ${{ github.workspace }}/effectcraft
        run: |
          python3 .github/scripts/add_plugin_migration_progress.py
          python3 .github/scripts/integrate_windows_compat_runtime.py
          python3 .github/scripts/add_windows_runtime_ui.py

      - name: Parse generated Rust source
        run: |
          rustup component add rustfmt
          rustfmt --edition 2024 --emit stdout effectcraft/crates/engine/src/cmd/effect.rs >/dev/null
          rustfmt --edition 2024 --emit stdout effectcraft/crates/ui-egui/src/header.rs >/dev/null
          rustfmt --edition 2024 --emit stdout effectcraft/crates/ui-egui/src/plugin_migration.rs >/dev/null
          rustfmt --edition 2024 --emit stdout effectcraft/crates/ui-egui/src/windows_compat_android.rs >/dev/null

      - name: Type-check the patched EffectCraft engine
        working-directory: effectcraft
        run: cargo check --locked -p effectcraft-engine --lib

      - name: Type-check the patched migration UI and Android JNI bridge
        working-directory: effectcraft
        run: cargo check --locked -p effectcraft-ui-egui --lib

      - name: Check required runtime architecture and memory policy
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("windows-compat/runtime-manifest.json").read_text())
          assert manifest["target_abi"] == ["arm64-v8a"]
          assert manifest["memory_policy"]["application_imposed_ram_limit"] is False
          assert manifest["memory_policy"]["rlimit_as"] is False
          assert manifest["memory_policy"]["cgroup_memory_limit"] is False
          assert manifest["memory_policy"]["box64_artificial_memory_cap"] is False
          readme = Path("windows-compat/README.md").read_text()
          for item in ("Wine", "Box64", "Hangover", "AEX", "SmartFX", "AEGP", "no"):
              assert item.lower() in readme.lower(), item
          print("Windows compatibility manifest and no-app-RAM-cap policy validated.")
          PY

      - name: Check patch contains static PE inspection and single-file routing
        run: |
          grep -Fq 'fn windows_pe_metadata' .github/scripts/add_desktop_plugin_package_support.py
          grep -Fq 'fn inspect_desktop_native_file' .github/scripts/add_desktop_plugin_package_support.py
          grep -Fq 'return inspect_desktop_native_file(s, path)' .github/scripts/add_desktop_plugin_package_support.py
          echo "PE static analysis and direct native plug-in routing are present."

      # Keep the slow emulator boot/test after fast source, Gradle, and Rust checks,
      # so it cannot hide a compile or integration failure.
      - name: Run native archive tests on Android x86_64 emulator
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 -cores 2
          disable-animations: true
          script: gradle -p windows-compat/android-runtime connectedDebugAndroidTest --no-daemon

name: Test preserved EffectCraft Build 44 on native ARM64 Android 12

on:
  push:
    paths:
      - ".github/workflows/test-preserved-build44.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  android12-arm64-install:
    name: Install the unchanged Build 44 APK on native ARM64 Android 12
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Confirm native Apple Silicon host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          uname -a
          system_profiler SPHardwareDataType | grep -E "Chip|Total Number of Cores|Memory"

      - name: Download the exact APK artifact from Build 44
        uses: actions/download-artifact@v4
        with:
          name: EffectCraft-Android-APK
          path: release
          repository: ${{ github.repository }}
          run-id: 42480458147
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact preserved APK
        shell: bash
        run: |
          set -euo pipefail
          APK="release/effectcraft-0.21.1.apk"
          test -s "$APK"
          test "$(stat -f%z "$APK")" = "1093320533"
          echo "1455b07752a59e61156b6ca5b20cfa633c41018f357a7e88d22e7b6fad86ce98  $APK" | shasum -a 256 -c -

      - name: Install APK on Android 12 ARM64 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_atd
          arch: arm64-v8a
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 6G
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            APK="release/effectcraft-0.21.1.apk"
            SDK_LEVEL="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
            test "$SDK_LEVEL" = "31"
            ABI_LIST="$(adb shell getprop ro.product.cpu.abilist | tr -d '\r')"
            echo "Android 12 ARM64 emulator ABI list: $ABI_LIST"
            case "$ABI_LIST" in
              *arm64-v8a*) ;;
              *)
                echo "::error::The Android 12 emulator does not expose arm64-v8a."
                exit 1
                ;;
            esac
            echo "Installing the preserved APK with Android Package Manager..."
            adb install --abi arm64-v8a -r "$APK"
            PACKAGE_PATH="$(adb shell pm path com.artcraft.effectcraft | tr -d '\r')"
            test -n "$PACKAGE_PATH"
            echo "$PACKAGE_PATH"
            echo "Android 12 ARM64 Package Manager installation passed."
            adb shell monkey -p com.artcraft.effectcraft 1
            sleep 5
            echo "App launch command completed on Android 12 ARM64."


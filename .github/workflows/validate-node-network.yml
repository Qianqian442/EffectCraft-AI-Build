name: Validate EffectCraft domestic server

on:
  push:
    branches: [implementation/admin-phone-main-server]
    paths:
      - 'domestic-server/**'
      - '.github/workflows/validate-node-network.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-domestic-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: domestic-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Node.js server syntax
        run: node --check src/server.js
      - name: Install dependencies and validate package
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate Docker configuration
        run: |
          cp .env.example .env
          docker compose config
          docker build -t effectcraft-domestic-server-check .

name: Build EffectCraft AI Android APK

on:
  push:
    branches: [main, design/no-server-node-mesh, implementation/p2p-full-replacement, implementation/admin-phone-main-server]
    paths:
      - '.github/workflows/build-effectcraft-ai.yml'
      - '.github/scripts/patch_export_dialog.py'
      - '.github/scripts/add_android_gallery_export.py'
      - '.github/scripts/install_ai_plugin_bridge.py'
      - '.github/scripts/ai_assistant_plugin.rs'
      - '.github/scripts/upgrade_export_preflight.py'
      - '.github/scripts/ai_assistant_local.rs'
      - 'assets/ae-avatar.png'
      - '.github/native/**'
      - '.github/scripts/integrate_video_ai.py'
      - '.github/scripts/restore_android_plugins.py'
      - '.github/scripts/add_plugin_import_button.py'
      - '.github/scripts/add_zip_plugin_support.py'
      - '.github/scripts/add_desktop_plugin_package_support.py'
      - '.github/scripts/add_plugin_migration_progress.py'
      - '.github/scripts/configure_android_storage_fallback.py'
      - '.github/scripts/add_project_import_formats.py'
      - '.github/scripts/add_am_nv_project_import.py'
      - '.github/scripts/am_nv.rs'
      - '.github/scripts/add_chinese_group_puppet_keyframe_ui.py'
      - '.github/scripts/add_home_lan_account_gate.py'
      - '.github/scripts/convert_account_gate_to_cloud.py'
      - '.github/scripts/add_libp2p_node_layer.py'
      - '.github/scripts/make_header_scrollable.py'
      - '.github/scripts/add_curve_quick_access.py'
      - '.github/scripts/add_startup_attribution_notice.py'
      - '.github/scripts/add_chroma_key_effect.py'
      - '.github/scripts/add_bottom_left_media_import.py'
      - '.github/scripts/add_puppet_pin_links.py'
      - '.github/scripts/add_mobile_touch_scroll.py'
      - '.github/scripts/add_mobile_rsmb_controls.py'
      - '.github/scripts/ai_video_export.rs'
      - '.github/scripts/sapphire_compat_pack.rs'
      - '.github/scripts/build_sapphire_compat_pack.py'
      - '.github/scripts/build_rsmb_compat.py'
      - '.github/scripts/looks_compat_pack.rs'
      - '.github/scripts/build_looks_compat_pack.py'
      - 'vendor/effectcraft/crates/ui-egui/src/panels/timeline.rs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Only the newest source revision should consume a runner for this APK.
  group: effectcraft-ai-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-patches:
    name: Validate Android build patch scripts
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile patch scripts
        run: |
          python3 -m py_compile \
            .github/scripts/patch_export_dialog.py \
            .github/scripts/upgrade_export_preflight.py \
            .github/scripts/integrate_video_ai.py \
            .github/scripts/add_android_gallery_export.py \
            .github/scripts/convert_account_gate_to_cloud.py \
            .github/scripts/add_libp2p_node_layer.py \

  build:
    needs: validate-patches
    name: Build EffectCraft 0.21.1 with AI helper
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      ARTCRAFT_BUILD_TOOLS_VERSION: '35.0.0'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_DEBUG: 'false'

    steps:
      - name: Check out ArtCraft Android builder v0.5.0
        uses: actions/checkout@v4
        with:
          repository: MostafaXS1/artcraft-android
          ref: v0.5.0
          path: artcraft

      - name: Restore persistent EffectCraft APK signing key
        id: signing_key_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            artcraft/keys/artcraft-builder.jks
            artcraft/keys/.keystore-password
          key: effectcraft-apk-signing-v1-${{ github.repository_id }}

      - name: Check out EffectCraft v0.21.1 source
        uses: actions/checkout@v4
        with:
          repository: storytold/effectcraft
          ref: v0.21.1
          path: artcraft/source/effectcraft

      - name: Check out project branding assets
        uses: actions/checkout@v4
        with:
          path: build-assets

      - name: Check out RIFE 4.6 ncnn source and model
        uses: actions/checkout@v4
        with:
          repository: nihui/rife-ncnn-vulkan
          ref: master
          path: native-deps/rife
          submodules: recursive

      - name: Check out Real-ESRGAN ncnn source
        uses: actions/checkout@v4
        with:
          repository: xinntao/Real-ESRGAN-ncnn-vulkan
          ref: master
          path: native-deps/realesrgan

      - name: Restore Cargo dependency cache
        id: build_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: effectcraft-deps-cache-v2-${{ runner.os }}-${{ hashFiles('artcraft/source/effectcraft/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            effectcraft-deps-cache-v2-${{ runner.os }}-

      - name: Bundle the Real-ESRGAN x4 local model
        shell: bash
        run: |
          set -euo pipefail
          MODEL_DIR="$GITHUB_WORKSPACE/artcraft/source/effectcraft/assets/models"
          mkdir -p "$MODEL_DIR"
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            "https://huggingface.co/edgetools/realesrgan/resolve/main/realesrgan-x4plus.param?download=true" \
            -o "$MODEL_DIR/realesrgan-x4plus.param"
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            "https://huggingface.co/edgetools/realesrgan/resolve/main/realesrgan-x4plus.bin?download=true" \
            -o "$MODEL_DIR/realesrgan-x4plus.bin"
          PARAM_BYTES="$(stat -c%s "$MODEL_DIR/realesrgan-x4plus.param")"
          MODEL_BYTES="$(stat -c%s "$MODEL_DIR/realesrgan-x4plus.bin")"
          if (( PARAM_BYTES < 100000 || MODEL_BYTES < 30000000 || MODEL_BYTES > 40000000 )); then
            echo "Unexpected Real-ESRGAN x4 model sizes: param=$PARAM_BYTES bin=$MODEL_BYTES" >&2
            exit 1
          fi
          mkdir -p "$MODEL_DIR/rife-v4.6"
          cp native-deps/rife/models/rife-v4.6/flownet.param "$MODEL_DIR/rife-v4.6/"
          cp native-deps/rife/models/rife-v4.6/flownet.bin "$MODEL_DIR/rife-v4.6/"
          test "$(stat -c%s "$MODEL_DIR/rife-v4.6/flownet.bin")" -gt 10000000
          echo "Bundled RIFE 4.6 and Real-ESRGAN x4 models into APK assets."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure Android shared-storage SAF fallback
        env:
          ARTCRAFT_DIR: ${{ github.workspace }}/artcraft
        run: python3 ${{ github.workspace }}/build-assets/.github/scripts/configure_android_storage_fallback.py

      - name: Apply the AI assistant and export changes
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: |
          python3 - <<'PY'
          import base64, zlib
          from pathlib import Path
          payload = ""
          Path('/tmp/patch_effectcraft_ai.py').write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY
          mkdir -p "$EFFECTCRAFT_DIR/assets"
          cp "$GITHUB_WORKSPACE/build-assets/assets/ae-avatar.png" "$EFFECTCRAFT_DIR/assets/ae-avatar.png"
          python3 /tmp/patch_effectcraft_ai.py
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["EFFECTCRAFT_DIR"]) / "crates/ui-egui/src/ai_assistant.rs"
          s = p.read_text()
          old = 'const DEFAULT_CHAT_MODEL: &str = "Qwen/Qwen3-8B";'
          new = 'const DEFAULT_CHAT_MODEL: &str = "deepseek-ai/DeepSeek-R1-0528-Qwen3-8B";'
          if old not in s:
              raise SystemExit("Expected default chat model declaration was not found")
          p.write_text(s.replace(old, new, 1))
          print("Configured DeepSeek 8B chat and DeepSeek-OCR image recognition.")
          PY

          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["EFFECTCRAFT_DIR"]) / "crates/ui-egui/src/ai_assistant.rs"
          s = p.read_text()
          old = "if let Some(name) = &state.image_name {"
          new = "if let Some(name) = state.image_name.clone() {"
          count = s.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one image-name borrow site, found {count}")
          p.write_text(s.replace(old, new, 1))
          print("Fixed AI image attachment borrow conflict.")
          PY

          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["EFFECTCRAFT_DIR"]) / "crates/ui-egui/src/ai_assistant.rs"
          s = p.read_text()
          avatar_const = "const MAX_IMAGE_BYTES: u64 = 7 * 1024 * 1024;"
          if "const AVATAR_PNG:" not in s:
              if avatar_const not in s:
                  raise SystemExit("Could not find the AI assistant constants")
              s = s.replace(
                  avatar_const,
                  avatar_const + '\nconst AVATAR_PNG: &[u8] = include_bytes!(\"../../../assets/ae-avatar.png\");',
                  1,
              )

          state_field = "    notice: String,\n}"
          if "avatar_texture: Option<egui::TextureHandle>" not in s:
              if state_field not in s:
                  raise SystemExit("Could not find the AI assistant State fields")
              s = s.replace(
                  state_field,
                  "    notice: String,\n    avatar_texture: Option<egui::TextureHandle>,\n}",
                  1,
              )
          state_default = "            notice: String::new(),\n        }"
          if "avatar_texture: None" not in s:
              if state_default not in s:
                  raise SystemExit("Could not find the AI assistant default state")
              s = s.replace(
                  state_default,
                  "            notice: String::new(),\n            avatar_texture: None,\n        }",
                  1,
              )

          old_show = "\n".join([
              "    let ctx = root.ctx().clone();",
              "    let state = &mut app.ai_assistant;",
              "    poll_result(state, &ctx);",
          ]) + "\n"
          new_show = "\n".join([
              "    let ctx = root.ctx().clone();",
              "    let state = &mut app.ai_assistant;",
              "    let avatar = state.avatar_texture.get_or_insert_with(|| {",
              "        let decoded = image::load_from_memory(AVATAR_PNG)",
              "            .expect(\"embedded Ae avatar PNG must decode\")",
              "            .to_rgba8();",
              "        let size = [decoded.width() as usize, decoded.height() as usize];",
              "        ctx.load_texture(",
              "            \"effectcraft-ai-avatar\",",
              "            egui::ColorImage::from_rgba_unmultiplied(size, decoded.as_raw()),",
              "            egui::TextureOptions::LINEAR,",
              "        )",
              "    }).clone();",
              "    poll_result(state, &ctx);",
          ]) + "\n"
          if old_show not in s:
              raise SystemExit("Could not find AI assistant show() initialization block")
          s = s.replace(old_show, new_show, 1)

          old_button = "\n".join([
              "            let button = egui::Button::new(egui::RichText::new(\"AI\").strong().color(Color32::WHITE))",
              "                .fill(Color32::from_rgb(50, 105, 210))",
              "                .stroke(egui::Stroke::new(1.0, Color32::from_rgb(125, 175, 255)))",
              "                .corner_radius(24.0);",
              "            if ui.add_sized(vec2(48.0, 48.0), button).clicked() {",
              "                state.open = !state.open;",
              "            }",
          ]) + "\n"
          new_button = "\n".join([
              "            let avatar_button = egui::Image::new(&avatar)",
              "                .fit_to_exact_size(vec2(48.0, 48.0))",
              "                .corner_radius(24)",
              "                .sense(Sense::click());",
              "            if ui.add(avatar_button).clicked() {",
              "                state.open = !state.open;",
              "            }",
          ]) + "\n"
          if old_button not in s:
              raise SystemExit("Could not find floating AI bubble button block")
          s = s.replace(old_button, new_button, 1)

          p.write_text(s)
          print("Embedded the supplied Ae avatar in the draggable AI bubble.")
          PY

      - name: Integrate the standalone DeepSeek plugin into the original assistant
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
          ARTCRAFT_DIR: ${{ github.workspace }}/artcraft
        run: python3 build-assets/.github/scripts/install_ai_plugin_bridge.py

      - name: Preserve project import and configure centered export dialog
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: python3 build-assets/.github/scripts/patch_export_dialog.py

      - name: Save exported videos to Android Gallery and show success confirmation
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
          ARTCRAFT_DIR: ${{ github.workspace }}/artcraft
        run: python3 build-assets/.github/scripts/add_android_gallery_export.py


      - name: Integrate RIFE and Real-ESRGAN into actual export frames
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
          RIFE_SOURCE_DIR: ${{ github.workspace }}/native-deps/rife
          ESRGAN_SOURCE_DIR: ${{ github.workspace }}/native-deps/realesrgan
        run: python3 build-assets/.github/scripts/integrate_video_ai.py

      - name: Add comprehensive Android export preflight
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: python3 build-assets/.github/scripts/upgrade_export_preflight.py



      - name: Restore original EffectCraft WASM plug-in auto-loading on Android
        env:
          ARTCRAFT_DIR: ${{ github.workspace }}/artcraft
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: python3 build-assets/.github/scripts/restore_android_plugins.py



      - name: Add a top-left WASM plug-in import button
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: python3 build-assets/.github/scripts/add_plugin_import_button.py

      - name: Add safe ZIP effect plug-in archive import
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: python3 build-assets/.github/scripts/add_zip_plugin_support.py

      - name: Add desktop plug-in package inspection and AE script import
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: |
          python3 -m py_compile build-assets/.github/scripts/add_desktop_plugin_package_support.py
          python3 build-assets/.github/scripts/add_desktop_plugin_package_support.py

      - name: Add draggable AE plug-in migration and progress windows
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: |
          python3 -m py_compile build-assets/.github/scripts/add_plugin_migration_progress.py
          python3 build-assets/.github/scripts/add_plugin_migration_progress.py

      - name: Route AE projects through the original Import Project control
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: python3 build-assets/.github/scripts/add_project_import_formats.py

      - name: Add Alight Motion and NodeVideo project import support
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: |
          python3 -m py_compile build-assets/.github/scripts/add_am_nv_project_import.py
          python3 build-assets/.github/scripts/add_am_nv_project_import.py

      - name: Add Simplified Chinese, Puppet shortcut, project grouping and single-item keyframes
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: python3 build-assets/.github/scripts/add_chinese_group_puppet_keyframe_ui.py

      - name: Add mandatory home-Wi-Fi account registration, login and ban gate
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: |
          python3 -m py_compile build-assets/.github/scripts/add_home_lan_account_gate.py
          python3 build-assets/.github/scripts/add_home_lan_account_gate.py

      # Keep the account gate on the manager-phone endpoint. Do not run the
      # legacy public-cloud conversion: this project is moving away from hosted
      # account infrastructure and must not silently depend on a foreign service.

      - name: Add native rust-libp2p node transport
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: |
          python3 -m py_compile build-assets/.github/scripts/add_libp2p_node_layer.py
          python3 build-assets/.github/scripts/add_libp2p_node_layer.py

      - name: Add independent connected Puppet pin rigs
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: python3 build-assets/.github/scripts/add_puppet_pin_links.py

      - name: Add draggable curve presets to the Android Timeline
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: python3 build-assets/.github/scripts/add_curve_quick_access.py

      - name: Make Android toolbar touch-scrollable on narrow screens
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: python3 build-assets/.github/scripts/make_header_scrollable.py

      - name: Enable touch scrolling across Android panels and timelines
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: python3 build-assets/.github/scripts/add_mobile_touch_scroll.py

      - name: Make RSMB controls touch-friendly
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: |
          python3 -m py_compile build-assets/.github/scripts/add_mobile_rsmb_controls.py
          python3 build-assets/.github/scripts/add_mobile_rsmb_controls.py

      - name: Add creator attribution notice on every app launch
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: |
          python3 -m py_compile build-assets/.github/scripts/add_startup_attribution_notice.py
          python3 build-assets/.github/scripts/add_startup_attribution_notice.py

      - name: Add Chroma Key effect with color presets and eyedropper
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: |
          python3 -m py_compile build-assets/.github/scripts/add_chroma_key_effect.py
          python3 build-assets/.github/scripts/add_chroma_key_effect.py


      - name: Add bottom-left media import quick entry
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: |
          python3 -m py_compile build-assets/.github/scripts/add_bottom_left_media_import.py
          python3 build-assets/.github/scripts/add_bottom_left_media_import.py

      - name: Save generated AI assistant source for offline integration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EffectCraft-AI-assistant-source
          path: |
            artcraft/source/effectcraft/crates/ui-egui/src/ai_assistant.rs
            artcraft/source/effectcraft/crates/ui-egui/src/lib.rs
            artcraft/source/effectcraft/crates/ui-egui/Cargo.toml
          if-no-files-found: warn
          retention-days: 7

      - name: Install Python image dependency
        run: python -m pip install --upgrade pillow

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare persistent EffectCraft APK signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artcraft/keys
          KEY="artcraft/keys/artcraft-builder.jks"
          PASSWORD_FILE="artcraft/keys/.keystore-password"
          if [[ -f "$KEY" && ! -s "$PASSWORD_FILE" ]]; then
            echo "Signing keystore exists but its password file is missing; refusing to replace it." >&2
            exit 1
          fi
          if [[ ! -s "$KEY" ]]; then
            if [[ ! -s "$PASSWORD_FILE" ]]; then
              python3 -c 'import secrets; print(secrets.token_hex(32))' > "$PASSWORD_FILE"
            fi
            KEY_PASSWORD="$(<"$PASSWORD_FILE")"
            keytool -genkeypair -noprompt -v \
              -keystore "$KEY" -storetype JKS \
              -storepass "$KEY_PASSWORD" -keypass "$KEY_PASSWORD" \
              -alias artcraftbuilder -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=EffectCraft Android Release, OU=EffectCraft, O=EffectCraft, C=US"
          fi
          chmod 600 "$KEY" "$PASSWORD_FILE"
          KEY_PASSWORD="$(<"$PASSWORD_FILE")"
          keytool -list -keystore "$KEY" -storepass "$KEY_PASSWORD" -alias artcraftbuilder >/dev/null
          echo "Persistent APK signing key is ready."

      - name: Save persistent EffectCraft APK signing key
        if: steps.signing_key_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            artcraft/keys/artcraft-builder.jks
            artcraft/keys/.keystore-password
          key: effectcraft-apk-signing-v1-${{ github.repository_id }}

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, wasm32-unknown-unknown

      - name: Build built-in Sapphire-compatible WASM effects
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: python3 build-assets/.github/scripts/build_sapphire_compat_pack.py

      - name: Build standalone RSMB-style directional blur effect
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: python3 build-assets/.github/scripts/build_rsmb_compat.py

      - name: Build built-in Looks-style color grading effect
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: python3 build-assets/.github/scripts/build_looks_compat_pack.py

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          # sdkmanager closes stdin once all licenses are accepted; yes receives an expected
          # broken pipe. Disable pipefail for this one pipeline only, then restore it.
          set +o pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER_DIR="$(dirname "$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)")"
          test -x "$SDKMANAGER_DIR/sdkmanager"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER_DIR/sdkmanager" --licenses >/dev/null
          set -o pipefail

      - name: Install Android build components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cargo/bin"
          ARCHIVE="$RUNNER_TEMP/cargo-ndk-v4.1.2.tgz"
          if curl -fL --retry 2 --retry-all-errors --retry-delay 3 \
            "https://github.com/bbqsrc/cargo-ndk/releases/download/v4.1.2/cargo-ndk-x86_64-unknown-linux-musl-v4.1.2.tgz" \
            -o "$ARCHIVE"; then
            tar -xzf "$ARCHIVE" --strip-components=1 -C "$HOME/.cargo/bin"
          else
            echo "GitHub binary download failed; installing cargo-ndk from crates.io instead."
            cargo install cargo-ndk --version 4.1.2 --locked
          fi
          chmod +x "$HOME/.cargo/bin/cargo-ndk"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cargo ndk -V

      - name: Validate rust-libp2p Android ARM64 dependency compatibility
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android28-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          test -x "$CC_aarch64_linux_android"
          SMOKE="$RUNNER_TEMP/libp2p-android-smoke"
          mkdir -p "$SMOKE/src"
          cat > "$SMOKE/Cargo.toml" <<'EOF'
          [package]
          name = "effectcraft-libp2p-android-smoke"
          version = "0.1.0"
          edition = "2024"

          [dependencies]
          libp2p = { version = "=0.57.1", default-features = false, features = ["tokio", "tcp", "quic", "dns", "noise", "yamux", "relay", "dcutr", "autonat", "identify", "macros", "ed25519"] }
          tokio = { version = "1", features = ["rt", "time", "net"] }
          EOF
          printf 'fn main() {}\n' > "$SMOKE/src/main.rs"
          cargo check --manifest-path "$SMOKE/Cargo.toml" --target aarch64-linux-android
          echo "rust-libp2p dependency graph compiles for Android ARM64."

      - name: Install GLSL compiler for Real-ESRGAN Vulkan shaders
        shell: bash
        run: |
          set -euo pipefail
          # Retry transient Ubuntu mirror/network failures instead of aborting the APK build.
          for attempt in 1 2 3; do
            if sudo apt-get update; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "APT package index update failed after 3 attempts." >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
          for attempt in 1 2 3; do
            if sudo apt-get install -y glslang-tools; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Could not install glslang-tools after 3 attempts." >&2
              exit 1
            fi
            sudo apt-get clean
            sleep $((attempt * 10))
          done
          command -v glslangValidator

      - name: Build local RIFE and Real-ESRGAN worker for Android arm64
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_NDK_HOME"
          SYSROOT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          VULKAN_LIB="$SYSROOT/usr/lib/aarch64-linux-android/28/libvulkan.so"
          VULKAN_HEADERS="$SYSROOT/usr/include"
          test -f "$VULKAN_LIB"
          test -f "$VULKAN_HEADERS/vulkan/vulkan.h"
          cmake -S artcraft/source/effectcraft/native/effectcraft-ai-video \
            -B native-video-build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DVulkan_INCLUDE_DIR="$VULKAN_HEADERS" \
            -DVulkan_LIBRARY="$VULKAN_LIB" \
            -DRIFE_SOURCE_DIR="$GITHUB_WORKSPACE/native-deps/rife" \
            -DESRGAN_SOURCE_DIR="$GITHUB_WORKSPACE/native-deps/realesrgan"
          cmake --build native-video-build --target effectcraft-ai-video-worker --parallel 2
          WORKER="native-video-build/bin/effectcraft-ai-video-worker"
          test -s "$WORKER"
          mkdir -p artcraft/source/effectcraft/native
          install -m 0755 "$WORKER" artcraft/source/effectcraft/native/effectcraft-ai-video-worker
          STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          test -x "$STRIP"
          "$STRIP" --strip-unneeded artcraft/source/effectcraft/native/effectcraft-ai-video-worker
          file artcraft/source/effectcraft/native/effectcraft-ai-video-worker

      - name: Free temporary build disk space before APK packaging
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk usage before cleanup:"
          df -h "$GITHUB_WORKSPACE"
          # These sources and CMake intermediates are no longer needed after the native worker is built.
          rm -rf "$GITHUB_WORKSPACE/native-deps" "$GITHUB_WORKSPACE/native-video-build"
          rm -rf "$GITHUB_WORKSPACE/build-assets"
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          # Android emulator images are not used by this arm64 APK build.
          sudo rm -rf "$ANDROID_HOME/system-images" "$ANDROID_HOME/emulator"
          echo "Disk usage after cleanup:"
          df -h "$GITHUB_WORKSPACE"

      - name: Validate patched Rust workspace manifests
        working-directory: artcraft/source/effectcraft
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, tomllib
          paths = [pathlib.Path("Cargo.toml"), pathlib.Path("crates/ui-egui/Cargo.toml"), pathlib.Path("crates/engine/Cargo.toml")]
          for path in paths:
              raw = path.read_text(encoding="utf-8")
              try:
                  tomllib.loads(raw)
              except tomllib.TOMLDecodeError as error:
                  lines = raw.splitlines()
                  match = re.search(r"at line (\\d+), column (\\d+)", str(error))
                  line = int(match.group(1)) if match else 1
                  print(f"Invalid TOML in {path}: {error}")
                  for number in range(max(1, line - 3), min(len(lines), line + 3) + 1):
                      print(f"{number}: {lines[number - 1]}")
                  raise
              print(f"Valid TOML: {path}")
          PY

      - name: Build EffectCraft APK
        id: build_apk
        working-directory: artcraft
        env:
          BUILD_MODE: release
          BUILD_SOURCE: v0.21.1
        run: |
          set -euo pipefail
          mkdir -p logs output

          # The upstream Gradle wrapper template uses a 10-second network timeout.
          # A large Android distribution download exceeded that limit after Rust had
          # already compiled for 29 minutes. Raise it before android_project.py copies
          # the wrapper into the generated project.
          WRAPPER_PROPERTIES="templates/gradle/gradle/wrapper/gradle-wrapper.properties"
          test -f "$WRAPPER_PROPERTIES"
          if grep -q '^networkTimeout=' "$WRAPPER_PROPERTIES"; then
            sed -i 's/^networkTimeout=.*/networkTimeout=300000/' "$WRAPPER_PROPERTIES"
          else
            printf '\nnetworkTimeout=300000\n' >> "$WRAPPER_PROPERTIES"
          fi
          grep -Fqx 'networkTimeout=300000' "$WRAPPER_PROPERTIES"
          echo "Gradle wrapper download timeout set to 300000 ms (5 minutes)."

          # AGP 8.7.3 generated only V3 with its defaults in the previous APK.
          # Explicitly enable all required APK signing schemes in the generated Gradle project.
          GENERATOR="lib/android_project.py"
          test -s "$GENERATOR"
          python3 - "$GENERATOR" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text()
          marker = "keyPassword System.getenv('ARTCRAFT_KEY_PASSWORD')"
          if source.count(marker) != 1:
              raise SystemExit(
                  f"Expected exactly one generated signing password marker; found {source.count(marker)}"
              )
          # Preserve the generator's Python string literal while adding Gradle signing flags.
          signing_flags = (
              "\n                enableV1Signing = true"
              "\n                enableV2Signing = true"
              "\n                enableV3Signing = true"
          )
          if "enableV1Signing = true" not in source:
              source = source.replace(marker, marker + signing_flags, 1)
          for flag in ("enableV1Signing = true", "enableV2Signing = true", "enableV3Signing = true"):
              if flag not in source:
                  raise SystemExit(f"Signing flag was not applied: {flag}")
          path.write_text(source)
          for flag in ("enableV1Signing = true", "enableV2Signing = true", "enableV3Signing = true"):
              if flag not in source:
                  raise SystemExit(f"Signing flag was not applied: {flag}")
          path.write_text(source)
          print("Configured generated APK signing: V1 + V2 + V3.")
          PY


          rm -f output/*.apk output/*.tmp
          set -o pipefail
          bash build.sh -effectcraft -appname=Ae -appicon="$PWD/source/effectcraft/assets/ae-avatar.png" --noupdate 2>&1 | tee logs/effectcraft-build.log

      - name: Align and sign APK with V1 V2 V3, then verify persistent certificate
        if: success()
        working-directory: artcraft
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="$(find output -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          KEYSTORE="keys/artcraft-builder.jks"
          PASSWORD_FILE="keys/.keystore-password"
          test -s "$KEYSTORE" && test -s "$PASSWORD_FILE"
          KEY_PASSWORD="$(<"$PASSWORD_FILE")"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          APK_SIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          VERIFY_REPORT="output/effectcraft-signature-verify.txt"
          KEY_REPORT="output/effectcraft-keystore-certificate.txt"
          ALIGNED_APK="output/effectcraft-aligned-unsigned.apk"
          RESIGNED_APK="output/effectcraft-v1-v2-v3.apk"
          test -x "$APK_SIGNER" && test -x "$ZIPALIGN"

          # Gradle/AGP 8.7.3 emitted a V3-only APK even though its signing config was
          # patched. Align the package and explicitly sign the aligned bytes with the
          # persistent project key, enabling the three schemes required by Android.
          echo "Aligning APK for 4-byte entries and page-aligned native libraries..."
          "$ZIPALIGN" -f -p 4 "$APK" "$ALIGNED_APK"
          "$ZIPALIGN" -c -p 4 "$ALIGNED_APK"

          echo "Signing final APK with V1 + V2 + V3 using the persistent project key..."
          "$APK_SIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias artcraftbuilder \
            --ks-pass "pass:$KEY_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$RESIGNED_APK" \
            "$ALIGNED_APK"
          mv -f "$RESIGNED_APK" "$APK"
          rm -f "$ALIGNED_APK"

          echo "Verifying the final signed APK..."
          if ! "$APK_SIGNER" verify --verbose --print-certs "$APK" > "$VERIFY_REPORT" 2>&1; then
            cat "$VERIFY_REPORT" >&2
            exit 1
          fi
          cat "$VERIFY_REPORT"

          # The packaged Android manifest has minSdk 28. Android 9 (API 28) and later,
          # including the target Android 12 devices, verify APK Signature Scheme V3.
          # V1 and V2 are compatibility schemes for older platform versions below this app's
          # minSdk, so their absence must not block a valid V3-only APK.
          grep -Fqx "Verified using v3 scheme (APK Signature Scheme v3): true" "$VERIFY_REPORT" || {
            echo "Required APK V3 signature is missing or invalid." >&2
            exit 1
          }

          keytool -list -v -keystore "$KEYSTORE" -storepass "$KEY_PASSWORD" \
            -alias artcraftbuilder > "$KEY_REPORT"
          EXPECTED_CERT="$(awk -F': ' '/SHA256:/{gsub(/:/,"",$2); print tolower($2); exit}' "$KEY_REPORT")"
          ACTUAL_CERT="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{gsub(/:/,"",$2); print tolower($2); exit}' "$VERIFY_REPORT")"
          echo "Persistent keystore certificate SHA-256: $EXPECTED_CERT"
          echo "APK signer certificate SHA-256:          $ACTUAL_CERT"
          test -n "$EXPECTED_CERT" && test -n "$ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT" || {
            echo "APK signer does not match the persistent project keystore." >&2
            exit 1
          }
          echo "Final APK V3 signature and persistent certificate verified for minSdk 28+ devices."

      - name: Verify APK integrity
        if: success()
        working-directory: artcraft
        run: |
          set -Eeuo pipefail
          trap 'status=$?; echo "::error::APK integrity validation failed at line ${LINENO}: ${BASH_COMMAND} (exit ${status})"; exit "$status"' ERR
          APK="$(find output -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          # Confirm the builder generated the Android startup auto-loader into the APK's Rust launcher.
          LAUNCHER_SRC="source/effectcraft/apps/effectcraft-android/src/lib.rs"
          test -s "$LAUNCHER_SRC"
          grep -Fq "EFFECTCRAFT_ANDROID_WASM_PLUGIN_AUTOLOAD_V1" "$LAUNCHER_SRC"
          grep -Fq "EFFECTCRAFT_ANDROID_BUILTIN_EFFECTS_V1" "$LAUNCHER_SRC"
          for MODULE in glow aura lensflare blur distort stylize; do
            test -s "source/effectcraft/assets/sapphire-compat/ec_sapphire_${MODULE}.wasm"
          done
          test -s "source/effectcraft/assets/rsmb-compat/ec_rsmb_motion_blur.wasm"
          test -s "source/effectcraft/assets/looks-compat/ec_looks_studio.wasm"
          grep -Fq '"ec_looks_studio.wasm"' "$LAUNCHER_SRC"
          grep -Fq 'const BUILTIN_EFFECTS_VERSION: &str = "2.0.0";' "$LAUNCHER_SRC"
          echo "Verified Android startup scanning for the original WASM plug-in folder and built-in Sapphire-compatible pack."
          SAPPHIRE_STRINGS="$(mktemp)"
          while IFS= read -r ENTRY; do
            unzip -p "$APK" "$ENTRY" | strings
          done < <(unzip -Z1 "$APK" | grep '^lib/arm64-v8a/.*[.]so$') > "$SAPPHIRE_STRINGS"
          for EFFECT_ID in \
            "org.effectcraft.sapphire.compat.glow" \
            "org.effectcraft.sapphire.compat.glow-aura" \
            "org.effectcraft.sapphire.compat.lensflare" \
            "org.effectcraft.sapphire.compat.blur" \
            "org.effectcraft.sapphire.compat.distort" \
            "org.effectcraft.sapphire.compat.stylize"; do
            grep -Fq "$EFFECT_ID" "$SAPPHIRE_STRINGS" || {
              echo "Built-in Sapphire-compatible module missing from APK: $EFFECT_ID" >&2
              exit 1
            }
          done
          grep -Fq "org.effectcraft.compat.rsmb-motion-blur" "$SAPPHIRE_STRINGS" || {
            echo "Standalone RSMB-compatible WASM module is missing from APK." >&2
            exit 1
          }
          for LOOKS_TOKEN in \
            "org.effectcraft.looks.studio" \
            "hsl_red_hue" \
            "hsl_blue_sat" \
            "curve_midtones" \
            "bloom_threshold" \
            "halation"; do
            grep -Fq "$LOOKS_TOKEN" "$SAPPHIRE_STRINGS" || {
              echo "Expanded Looks Studio control or module missing from APK: $LOOKS_TOKEN" >&2
              exit 1
            }
          done
          rm -f "$SAPPHIRE_STRINGS"
          echo "Verified six Sapphire-compatible modules, RSMB, and expanded Looks Studio 2.0 in the main APK."
          HEADER_SRC="source/effectcraft/crates/ui-egui/src/header.rs"
          grep -Fq "EFFECTCRAFT_ANDROID_PLUGIN_IMPORT_BUTTON_V1" "$HEADER_SRC"
          grep -Fq "EFFECTCRAFT_ANDROID_PLUGIN_IMPORT_MENU_V1" "$HEADER_SRC"
          grep -Fq "WASM / WAT / ZIP 效果插件" "$HEADER_SRC"
          grep -Fq "DeepSeek AI 插件 ZIP" "$HEADER_SRC"
          grep -Fq "EFFECTCRAFT_ANDROID_DESKTOP_PLUGIN_IMPORT_MENU_V1" "$HEADER_SRC"
          grep -Fq "AE 脚本 (.jsx/.js)" "$HEADER_SRC"
          grep -Fq "ScriptUI 面板 (.jsx)" "$HEADER_SRC"
          grep -Fq "EFFECTCRAFT_ANDROID_DESKTOP_PLUGIN_PACKAGE_IMPORT_V1" "source/effectcraft/crates/engine/src/cmd/effect.rs"
          grep -Fq '"file.installScriptUIPanel"' "source/effectcraft/crates/engine/src/cmd/scripts.rs"
          grep -Fq '"file.installScript"' "source/effectcraft/crates/engine/src/cmd/scripts.rs"
          grep -Fq '"effect.plugins.load"' "source/effectcraft/crates/engine/src/cmd/effect.rs"
          grep -Fq "Desktop-Originals" "source/effectcraft/crates/engine/src/cmd/effect.rs"
          grep -Fq "open_ai_plugin_import_from_toolbar" "source/effectcraft/crates/ui-egui/src/lib.rs"
          grep -Fq "EFFECTCRAFT_ANDROID_RESPONSIVE_HEADER_SCROLL_V1" "$HEADER_SRC"
          grep -Fq "EFFECTCRAFT_ANDROID_SINGLE_EXPORT_BUTTON_V1" "$HEADER_SRC"
          if grep -Fq "effectcraft-fixed-export-button" "$HEADER_SRC"; then
            echo "Duplicate pinned Export button detected in Android header." >&2
            exit 1
          fi
          echo "Verified narrow-screen touch scrolling keeps every toolbar button reachable."
          echo "Verified the visible top-left WASM plug-in import button is present in the APK source."
          grep -Fq "EFFECTCRAFT_ANDROID_EXPORT_PROGRESS_POPUP_V1" "$HEADER_SRC"
          echo "Verified the centered, draggable live export progress popup is present in the APK source."
          grep -Fq "EFFECTCRAFT_ANDROID_EXPORT_DEVICE_PREFLIGHT_V2" "$HEADER_SRC"
          grep -Fq "EFFECTCRAFT_ANDROID_GALLERY_SUCCESS_POPUP_V1" "$HEADER_SRC"
          KEYING_SRC="source/effectcraft/crates/effects/src/keying.rs"
          grep -Fq "EFFECTCRAFT_ANDROID_CHROMA_KEY_V1" "$KEYING_SRC"
          grep -Fq '"ec.key.chromakey"' "$KEYING_SRC"
          grep -Fq '("ec.key.chromakey", "Chroma Key", "色度键")' "source/effectcraft/crates/ui-egui/src/i18n/effects.rs"
          echo "Verified the Chroma Key effect, selectable screen-color presets and custom color picker are in the APK source."
          test -s "source/effectcraft/crates/ui-egui/src/android_gallery.rs"
          grep -Fq "EFFECTCRAFT_ANDROID_AI_PLUGIN_BRIDGE_V1" "templates/android/SafActivity.java"
          grep -Fq "new ZipInputStream(raw)" "templates/android/SafActivity.java"
          grep -Fq 'plugin.apk' "templates/android/SafActivity.java"
          grep -Fq "hasMatchingAiPluginSigner" "templates/android/SafActivity.java"
          grep -Fq "init_android_ai_bridge" "lib/build-common.sh"
          if grep -Eq "llama-cpp-(2|sys-2)" "source/effectcraft/crates/ui-egui/Cargo.toml"; then
            echo "DeepSeek inference dependency must live in the standalone plugin, not the host APK." >&2
            exit 1
          fi
          echo "Verified comprehensive Android export resource preflight is present in the APK source."
          APK_COUNT="$(find output -maxdepth 1 -type f -name '*.apk' | wc -l)"
          test "$APK_COUNT" -eq 1
          APK="$(find output -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          WORKER_PROBE="$(mktemp)"
          unzip -p "$APK" "lib/arm64-v8a/libeffectcraft-ai-video-worker.so" > "$WORKER_PROBE"
          test -s "$WORKER_PROBE"
          strings "$WORKER_PROBE" > "$WORKER_PROBE.strings"
          grep -Fq "gpu_count=" "$WORKER_PROBE.strings"
          grep -Fq "cpu_count=" "$WORKER_PROBE.strings"
          rm -f "$WORKER_PROBE" "$WORKER_PROBE.strings"
          echo "Verified the packaged ARM64 AI worker contains CPU/GPU capability probing."
          SIZE="$(stat -c%s "$APK")"
          test "$SIZE" -gt 1000000
          # Keep the single-file package below the 2 GiB boundary and validate every ZIP CRC.
          test "$SIZE" -lt 2147483648
          FILE_DESCRIPTION="$(file -b "$APK")"
          echo "Detected package type: $FILE_DESCRIPTION"
          case "$FILE_DESCRIPTION" in
            *"Android package (APK)"*|*"Zip archive"*) ;;
            *)
              echo "The generated file is not recognized as an APK/ZIP package: $FILE_DESCRIPTION" >&2
              exit 1
              ;;
          esac
          # The Android package format is ZIP-based. Validate its complete central directory
          # and every entry CRC rather than relying on the host 'file' utility's wording.
          unzip -tq "$APK"
          APK_ENTRIES="$(mktemp)"
          unzip -Z1 "$APK" > "$APK_ENTRIES"
          grep -Fxq "AndroidManifest.xml" "$APK_ENTRIES"
          grep -Fxq "resources.arsc" "$APK_ENTRIES"
          grep -Eq '^classes[0-9]*[.]dex$' "$APK_ENTRIES"
          grep -Fxq "lib/arm64-v8a/libeffectcraft-ai-video-worker.so" "$APK_ENTRIES"
          if grep -Eq '^assets/models/DeepSeek-.*\.gguf$' "$APK_ENTRIES"; then
            echo "DeepSeek GGUF must remain excluded from the host APK." >&2
            exit 1
          fi
          grep -Fxq "assets/models/rife-v4.6/flownet.bin" "$APK_ENTRIES"
          grep -Fxq "assets/models/realesrgan-x4plus.bin" "$APK_ENTRIES"
          rm -f "$APK_ENTRIES"
          echo "Verified APK contains DEX, RIFE 4.6, Real-ESRGAN x4 and Android native worker; DeepSeek GGUF is excluded from the host APK."
          echo "Verified APK: $APK ($SIZE bytes)"
          sha256sum "$APK"

      - name: Verify APK signature, Android manifest and alignment
        if: success()
        working-directory: artcraft
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find output -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          APK_SIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          test -x "$APK_SIGNER"
          test -x "$AAPT"
          test -x "$ZIPALIGN"

          echo "Checking Android 12-compatible APK V3 signature and signer certificate..."
          SIGNATURE_REPORT="$("$APK_SIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$SIGNATURE_REPORT"
          # V3 is supported from Android 9 onward and is sufficient for the Android 12 target.
          # V3 is the required scheme for this Android 12 (API 31) target.
          # Android 9+ verifies V3; V1 is only needed for legacy Android and V2 is not
          # a prerequisite when a valid V3 signing block is present.
          for SCHEME in \
            "Verified using v3 scheme (APK Signature Scheme v3): true"; do
            printf '%s\n' "$SIGNATURE_REPORT" | grep -Fq "$SCHEME" || {
              echo "Required APK signature scheme missing: $SCHEME" >&2
              exit 1
            }
          done
          EXPECTED_CERT="$(keytool -list -v -keystore keys/artcraft-builder.jks \
            -storepass "$(<keys/.keystore-password)" -alias artcraftbuilder \
            | awk -F': ' '/SHA256:/{gsub(/:/,"",$2); print tolower($2); exit}')"
          ACTUAL_CERT="$(printf '%s\n' "$SIGNATURE_REPORT" \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{gsub(/:/,"",$2); print tolower($2); exit}')"
          test -n "$EXPECTED_CERT"
          test -n "$ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"
          # The persistent keystore is the canonical project identity; the same key is checked
          # both before release and during every later build.
          echo "Verified APK uses the persistent project signing certificate."

          echo "Checking ZIP alignment..."
          "$ZIPALIGN" -c -v 4 "$APK"

          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -Fq "package: name='com.artcraft.effectcraft'"
          printf '%s\n' "$BADGING" | grep -Fq "sdkVersion:'28'"
          printf '%s\n' "$BADGING" | grep -Fq "native-code: 'arm64-v8a'"
          echo "$BADGING" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:|launchable-activity:)"
          echo "APK signature, manifest, ABI and alignment checks passed."

      - name: Detect built APK for direct download
        id: apk_available
        if: always() && steps.build_apk.outcome == 'success'
        working-directory: artcraft
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find output -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -n "$APK" && -s "$APK" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "APK is available for release upload: $APK"
            stat -c 'APK size: %s bytes' "$APK"
            sha256sum "$APK"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No non-empty APK was produced; skipping download publication."
          fi

      - name: Upload standalone APK artifact
        if: success() && steps.apk_available.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EffectCraft-Android-APK
          path: artcraft/output/effectcraft-0.21.1.apk
          compression-level: 0
          retention-days: 7

      - name: Ensure Cargo cache directories exist
        if: always()
        shell: bash
        run: |
          mkdir -p "$HOME/.cargo/registry" "$HOME/.cargo/git"

      - name: Save Cargo dependency cache
        if: always() && steps.build_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: effectcraft-deps-cache-v2-${{ runner.os }}-${{ hashFiles('artcraft/source/effectcraft/Cargo.lock') }}-${{ github.run_id }}

      - name: Upload build log if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: EffectCraft-Android-build-log
          path: |
            artcraft/logs/*.log
            artcraft/output/*.txt
          if-no-files-found: ignore
          retention-days: 30


  install-test:
    name: Install and launch main APK on Android ARM64 emulator
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: EffectCraft-Android-APK
          path: release
      - name: Install and launch on Android ARM64 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          emulator-boot-timeout: 1200
          script: |
            bash -euo pipefail -c 'APK="$(find release -type f -name "*.apk" -print -quit)"; test -n "$APK" && test -s "$APK"; adb install -r "$APK"; adb shell pm path com.artcraft.effectcraft; adb shell am force-stop com.artcraft.effectcraft || true; adb shell monkey -p com.artcraft.effectcraft -c android.intent.category.LAUNCHER 1; sleep 20; if ! adb shell pidof com.artcraft.effectcraft >/dev/null 2>&1; then adb logcat -d -t 5000 | grep -E "FATAL EXCEPTION|Fatal signal|AndroidRuntime|crash" | tail -120 || true; echo "Main APK did not remain running after launch on the ARM64 emulator." >&2; exit 1; fi; echo "Main APK installed and remained running on the Android ARM64 emulator."'

  publish:
    if: github.ref == 'refs/heads/main'
    name: Publish APK download after Android install test
    needs: install-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: EffectCraft-Android-APK
          path: release
      - name: Verify artifact transfer
        shell: bash
        run: |
          set -euo pipefail
          APK="release/effectcraft-0.21.1.apk"
          test -s "$APK"
          stat -c 'APK size: %s bytes' "$APK"
          sha256sum "$APK"
      - name: Publish standalone APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: effectcraft-ai-${{ github.run_number }}
          name: EffectCraft 0.21.1 Android APK (Build ${{ github.run_number }})
          body: |
            Standalone EffectCraft Android APK.
            Build-time APK integrity, signature, manifest, ARM64 ABI and ZIP-alignment checks passed.
            Android ARM64 emulator installation and launch smoke test passed.
          files: release/effectcraft-0.21.1.apk
          draft: false
          prerelease: true

name: Build EffectCraft AI Android APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-effectcraft-ai.yml'
      - '.github/scripts/patch_export_dialog.py'
      - '.github/scripts/upgrade_export_preflight.py'
      - '.github/scripts/ai_assistant_local.rs'
      - 'assets/ae-avatar.png'
      - '.github/native/**'
      - '.github/scripts/integrate_video_ai.py'
      - '.github/scripts/restore_android_plugins.py'
      - '.github/scripts/add_plugin_import_button.py'
      - '.github/scripts/ai_video_export.rs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Only the newest source revision should consume a runner for this APK.
  group: effectcraft-ai-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build EffectCraft 0.21.1 with AI helper
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ARTCRAFT_BUILD_TOOLS_VERSION: '35.0.0'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_DEBUG: 'false'
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /home/runner/.cache/sccache
      SCCACHE_CACHE_SIZE: 512M

    steps:
      - name: Check out ArtCraft Android builder v0.5.0
        uses: actions/checkout@v4
        with:
          repository: MostafaXS1/artcraft-android
          ref: v0.5.0
          path: artcraft

      - name: Restore persistent EffectCraft APK signing key
        id: signing_key_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            artcraft/keys/artcraft-builder.jks
            artcraft/keys/.keystore-password
          key: effectcraft-apk-signing-v1-${{ github.repository_id }}

      - name: Check out EffectCraft v0.21.1 source
        uses: actions/checkout@v4
        with:
          repository: storytold/effectcraft
          ref: v0.21.1
          path: artcraft/source/effectcraft

      - name: Check out project branding assets
        uses: actions/checkout@v4
        with:
          path: build-assets

      - name: Check out RIFE 4.6 ncnn source and model
        uses: actions/checkout@v4
        with:
          repository: nihui/rife-ncnn-vulkan
          ref: master
          path: native-deps/rife
          submodules: recursive

      - name: Check out Real-ESRGAN ncnn source
        uses: actions/checkout@v4
        with:
          repository: xinntao/Real-ESRGAN-ncnn-vulkan
          ref: master
          path: native-deps/realesrgan

      - name: Bundle the offline DeepSeek IQ4_XS model into APK assets
        shell: bash
        run: |
          set -euo pipefail
          MODEL_DIR="$GITHUB_WORKSPACE/artcraft/source/effectcraft/assets/models"
          MODEL_PATH="$MODEL_DIR/DeepSeek-R1-Distill-Qwen-1.5B-IQ4_XS.gguf"
          mkdir -p "$MODEL_DIR"
          echo "Downloading the 1.02 GB IQ4_XS local GGUF model (it will be packaged inside the APK)..."
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 --continue-at - \
            "https://huggingface.co/bartowski/DeepSeek-R1-Distill-Qwen-1.5B-GGUF/resolve/main/DeepSeek-R1-Distill-Qwen-1.5B-IQ4_XS.gguf?download=true"  \
            -o "$MODEL_PATH"
          MODEL_BYTES="$(stat -c%s "$MODEL_PATH")"
          if (( MODEL_BYTES < 950000000 || MODEL_BYTES > 1100000000 )); then
            echo "Unexpected GGUF size: $MODEL_BYTES bytes" >&2
            exit 1
          fi
          printf 'DeepSeek-R1-Distill-Qwen-1.5B IQ4_XS (space-saving quantization)\nSource: https://huggingface.co/bartowski/DeepSeek-R1-Distill-Qwen-1.5B-GGUF\nBundled in APK assets; copied to app-private storage on first launch.\n' > "$MODEL_DIR/README.txt"
          echo "Verified local GGUF asset: $MODEL_BYTES bytes"


      - name: Bundle the Real-ESRGAN x4 local model
        shell: bash
        run: |
          set -euo pipefail
          MODEL_DIR="$GITHUB_WORKSPACE/artcraft/source/effectcraft/assets/models"
          mkdir -p "$MODEL_DIR"
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            "https://huggingface.co/edgetools/realesrgan/resolve/main/realesrgan-x4plus.param?download=true" \
            -o "$MODEL_DIR/realesrgan-x4plus.param"
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            "https://huggingface.co/edgetools/realesrgan/resolve/main/realesrgan-x4plus.bin?download=true" \
            -o "$MODEL_DIR/realesrgan-x4plus.bin"
          PARAM_BYTES="$(stat -c%s "$MODEL_DIR/realesrgan-x4plus.param")"
          MODEL_BYTES="$(stat -c%s "$MODEL_DIR/realesrgan-x4plus.bin")"
          if (( PARAM_BYTES < 100000 || MODEL_BYTES < 30000000 || MODEL_BYTES > 40000000 )); then
            echo "Unexpected Real-ESRGAN x4 model sizes: param=$PARAM_BYTES bin=$MODEL_BYTES" >&2
            exit 1
          fi
          mkdir -p "$MODEL_DIR/rife-v4.6"
          cp native-deps/rife/models/rife-v4.6/flownet.param "$MODEL_DIR/rife-v4.6/"
          cp native-deps/rife/models/rife-v4.6/flownet.bin "$MODEL_DIR/rife-v4.6/"
          test "$(stat -c%s "$MODEL_DIR/rife-v4.6/flownet.bin")" -gt 10000000
          echo "Bundled RIFE 4.6 and Real-ESRGAN x4 models into APK assets."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply the AI assistant and export changes
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: |
          python3 - <<'PY'
          import base64, zlib
          from pathlib import Path
          payload = ""
          Path('/tmp/patch_effectcraft_ai.py').write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY
          mkdir -p "$EFFECTCRAFT_DIR/assets"
          cp "$GITHUB_WORKSPACE/build-assets/assets/ae-avatar.png" "$EFFECTCRAFT_DIR/assets/ae-avatar.png"
          python3 /tmp/patch_effectcraft_ai.py
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["EFFECTCRAFT_DIR"]) / "crates/ui-egui/src/ai_assistant.rs"
          s = p.read_text()
          old = 'const DEFAULT_CHAT_MODEL: &str = "Qwen/Qwen3-8B";'
          new = 'const DEFAULT_CHAT_MODEL: &str = "deepseek-ai/DeepSeek-R1-0528-Qwen3-8B";'
          if old not in s:
              raise SystemExit("Expected default chat model declaration was not found")
          p.write_text(s.replace(old, new, 1))
          print("Configured DeepSeek 8B chat and DeepSeek-OCR image recognition.")
          PY

          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["EFFECTCRAFT_DIR"]) / "crates/ui-egui/src/ai_assistant.rs"
          s = p.read_text()
          old = "if let Some(name) = &state.image_name {"
          new = "if let Some(name) = state.image_name.clone() {"
          count = s.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one image-name borrow site, found {count}")
          p.write_text(s.replace(old, new, 1))
          print("Fixed AI image attachment borrow conflict.")
          PY

          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["EFFECTCRAFT_DIR"]) / "crates/ui-egui/src/ai_assistant.rs"
          s = p.read_text()
          avatar_const = "const MAX_IMAGE_BYTES: u64 = 7 * 1024 * 1024;"
          if "const AVATAR_PNG:" not in s:
              if avatar_const not in s:
                  raise SystemExit("Could not find the AI assistant constants")
              s = s.replace(
                  avatar_const,
                  avatar_const + '\nconst AVATAR_PNG: &[u8] = include_bytes!(\"../../../assets/ae-avatar.png\");',
                  1,
              )

          state_field = "    notice: String,\n}"
          if "avatar_texture: Option<egui::TextureHandle>" not in s:
              if state_field not in s:
                  raise SystemExit("Could not find the AI assistant State fields")
              s = s.replace(
                  state_field,
                  "    notice: String,\n    avatar_texture: Option<egui::TextureHandle>,\n}",
                  1,
              )
          state_default = "            notice: String::new(),\n        }"
          if "avatar_texture: None" not in s:
              if state_default not in s:
                  raise SystemExit("Could not find the AI assistant default state")
              s = s.replace(
                  state_default,
                  "            notice: String::new(),\n            avatar_texture: None,\n        }",
                  1,
              )

          old_show = "\n".join([
              "    let ctx = root.ctx().clone();",
              "    let state = &mut app.ai_assistant;",
              "    poll_result(state, &ctx);",
          ]) + "\n"
          new_show = "\n".join([
              "    let ctx = root.ctx().clone();",
              "    let state = &mut app.ai_assistant;",
              "    let avatar = state.avatar_texture.get_or_insert_with(|| {",
              "        let decoded = image::load_from_memory(AVATAR_PNG)",
              "            .expect(\"embedded Ae avatar PNG must decode\")",
              "            .to_rgba8();",
              "        let size = [decoded.width() as usize, decoded.height() as usize];",
              "        ctx.load_texture(",
              "            \"effectcraft-ai-avatar\",",
              "            egui::ColorImage::from_rgba_unmultiplied(size, decoded.as_raw()),",
              "            egui::TextureOptions::LINEAR,",
              "        )",
              "    }).clone();",
              "    poll_result(state, &ctx);",
          ]) + "\n"
          if old_show not in s:
              raise SystemExit("Could not find AI assistant show() initialization block")
          s = s.replace(old_show, new_show, 1)

          old_button = "\n".join([
              "            let button = egui::Button::new(egui::RichText::new(\"AI\").strong().color(Color32::WHITE))",
              "                .fill(Color32::from_rgb(50, 105, 210))",
              "                .stroke(egui::Stroke::new(1.0, Color32::from_rgb(125, 175, 255)))",
              "                .corner_radius(24.0);",
              "            if ui.add_sized(vec2(48.0, 48.0), button).clicked() {",
              "                state.open = !state.open;",
              "            }",
          ]) + "\n"
          new_button = "\n".join([
              "            let avatar_button = egui::Image::new(&avatar)",
              "                .fit_to_exact_size(vec2(48.0, 48.0))",
              "                .corner_radius(24)",
              "                .sense(Sense::click());",
              "            if ui.add(avatar_button).clicked() {",
              "                state.open = !state.open;",
              "            }",
          ]) + "\n"
          if old_button not in s:
              raise SystemExit("Could not find floating AI bubble button block")
          s = s.replace(old_button, new_button, 1)

          p.write_text(s)
          print("Embedded the supplied Ae avatar in the draggable AI bubble.")
          PY

      - name: Preserve project import and configure centered export dialog
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: python3 build-assets/.github/scripts/patch_export_dialog.py

      - name: Integrate RIFE and Real-ESRGAN into actual export frames
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
          RIFE_SOURCE_DIR: ${{ github.workspace }}/native-deps/rife
          ESRGAN_SOURCE_DIR: ${{ github.workspace }}/native-deps/realesrgan
        run: python3 build-assets/.github/scripts/integrate_video_ai.py

      - name: Add comprehensive Android export preflight
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: python3 build-assets/.github/scripts/upgrade_export_preflight.py



      - name: Restore original EffectCraft WASM plug-in auto-loading on Android
        env:
          ARTCRAFT_DIR: ${{ github.workspace }}/artcraft
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: python3 build-assets/.github/scripts/restore_android_plugins.py



      - name: Add a top-left WASM plug-in import button
        env:
          EFFECTCRAFT_DIR: ${{ github.workspace }}/artcraft/source/effectcraft
        run: python3 build-assets/.github/scripts/add_plugin_import_button.py

      - name: Save generated AI assistant source for offline integration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EffectCraft-AI-assistant-source
          path: |
            artcraft/source/effectcraft/crates/ui-egui/src/ai_assistant.rs
            artcraft/source/effectcraft/crates/ui-egui/src/lib.rs
            artcraft/source/effectcraft/crates/ui-egui/Cargo.toml
          if-no-files-found: warn
          retention-days: 7

      - name: Install Python image dependency
        run: python -m pip install --upgrade pillow

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare persistent EffectCraft APK signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artcraft/keys
          KEY="artcraft/keys/artcraft-builder.jks"
          PASSWORD_FILE="artcraft/keys/.keystore-password"
          if [[ -f "$KEY" && ! -s "$PASSWORD_FILE" ]]; then
            echo "Signing keystore exists but its password file is missing; refusing to replace it." >&2
            exit 1
          fi
          if [[ ! -s "$KEY" ]]; then
            if [[ ! -s "$PASSWORD_FILE" ]]; then
              python3 -c 'import secrets; print(secrets.token_hex(32))' > "$PASSWORD_FILE"
            fi
            KEY_PASSWORD="$(<"$PASSWORD_FILE")"
            keytool -genkeypair -noprompt -v \
              -keystore "$KEY" -storetype JKS \
              -storepass "$KEY_PASSWORD" -keypass "$KEY_PASSWORD" \
              -alias artcraftbuilder -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=EffectCraft Android Release, OU=EffectCraft, O=EffectCraft, C=US"
          fi
          chmod 600 "$KEY" "$PASSWORD_FILE"
          KEY_PASSWORD="$(<"$PASSWORD_FILE")"
          keytool -list -keystore "$KEY" -storepass "$KEY_PASSWORD" -alias artcraftbuilder >/dev/null
          echo "Persistent APK signing key is ready."

      - name: Save persistent EffectCraft APK signing key
        if: steps.signing_key_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            artcraft/keys/artcraft-builder.jks
            artcraft/keys/.keystore-password
          key: effectcraft-apk-signing-v1-${{ github.repository_id }}

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          # sdkmanager closes stdin once all licenses are accepted; yes receives an expected
          # broken pipe. Disable pipefail for this one pipeline only, then restore it.
          set +o pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER_DIR="$(dirname "$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)")"
          test -x "$SDKMANAGER_DIR/sdkmanager"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER_DIR/sdkmanager" --licenses >/dev/null
          set -o pipefail

      - name: Install Android build components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.9.0

      - name: Install cargo-ndk
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl -fsSL https://github.com/bbqsrc/cargo-ndk/releases/download/v4.1.2/cargo-ndk-x86_64-unknown-linux-musl-v4.1.2.tgz | tar -xz --strip-components=1 -C "$HOME/.cargo/bin"
          chmod +x "$HOME/.cargo/bin/cargo-ndk"*
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cargo ndk -V

      - name: Install GLSL compiler for Real-ESRGAN Vulkan shaders
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools

      - name: Build local RIFE and Real-ESRGAN worker for Android arm64
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_NDK_HOME"
          SYSROOT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          VULKAN_LIB="$SYSROOT/usr/lib/aarch64-linux-android/28/libvulkan.so"
          VULKAN_HEADERS="$SYSROOT/usr/include"
          test -f "$VULKAN_LIB"
          test -f "$VULKAN_HEADERS/vulkan/vulkan.h"
          cmake -S artcraft/source/effectcraft/native/effectcraft-ai-video \
            -B native-video-build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DVulkan_INCLUDE_DIR="$VULKAN_HEADERS" \
            -DVulkan_LIBRARY="$VULKAN_LIB" \
            -DRIFE_SOURCE_DIR="$GITHUB_WORKSPACE/native-deps/rife" \
            -DESRGAN_SOURCE_DIR="$GITHUB_WORKSPACE/native-deps/realesrgan"
          cmake --build native-video-build --target effectcraft-ai-video-worker --parallel 2
          WORKER="native-video-build/bin/effectcraft-ai-video-worker"
          test -s "$WORKER"
          mkdir -p artcraft/source/effectcraft/native
          install -m 0755 "$WORKER" artcraft/source/effectcraft/native/effectcraft-ai-video-worker
          STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          test -x "$STRIP"
          "$STRIP" --strip-unneeded artcraft/source/effectcraft/native/effectcraft-ai-video-worker
          file artcraft/source/effectcraft/native/effectcraft-ai-video-worker

      - name: Free temporary build disk space before APK packaging
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk usage before cleanup:"
          df -h "$GITHUB_WORKSPACE"
          # These sources and CMake intermediates are no longer needed after the native worker is built.
          rm -rf "$GITHUB_WORKSPACE/native-deps" "$GITHUB_WORKSPACE/native-video-build"
          rm -rf "$GITHUB_WORKSPACE/build-assets"
          # Drop compiler cache now that compilation is complete; it is reproducible and can consume gigabytes.
          sccache --stop-server >/dev/null 2>&1 || true
          rm -rf "$SCCACHE_DIR"/*
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          # Android emulator images are not used by this arm64 APK build.
          sudo rm -rf "$ANDROID_HOME/system-images" "$ANDROID_HOME/emulator"
          echo "Disk usage after cleanup:"
          df -h "$GITHUB_WORKSPACE"

      - name: Build EffectCraft APK
        id: build_apk
        working-directory: artcraft
        env:
          BUILD_MODE: release
          BUILD_SOURCE: v0.21.1
        run: |
          mkdir -p logs output
          rm -f output/*.apk output/*.tmp
          set -o pipefail
          bash build.sh -effectcraft -appicon="$PWD/source/effectcraft/assets/ae-avatar.png" --noupdate 2>&1 | tee logs/effectcraft-build.log

      - name: Verify APK integrity
        if: success()
        working-directory: artcraft
        run: |
          set -Eeuo pipefail
          trap 'status=$?; echo "::error::APK integrity validation failed at line ${LINENO}: ${BASH_COMMAND} (exit ${status})"; exit "$status"' ERR
          # Confirm the builder generated the Android startup auto-loader into the APK's Rust launcher.
          LAUNCHER_SRC="source/effectcraft/apps/effectcraft-android/src/lib.rs"
          test -s "$LAUNCHER_SRC"
          grep -Fq "EFFECTCRAFT_ANDROID_WASM_PLUGIN_AUTOLOAD_V1" "$LAUNCHER_SRC"
          echo "Verified Android startup scanning for the original WASM plug-in folder."
          HEADER_SRC="source/effectcraft/crates/ui-egui/src/header.rs"
          test -s "$HEADER_SRC"
          grep -Fq "EFFECTCRAFT_ANDROID_PLUGIN_IMPORT_BUTTON_V1" "$HEADER_SRC"
          echo "Verified the visible top-left WASM plug-in import button is present in the APK source."
          grep -Fq "EFFECTCRAFT_ANDROID_EXPORT_PROGRESS_POPUP_V1" "$HEADER_SRC"
          echo "Verified the centered, draggable live export progress popup is present in the APK source."
          grep -Fq "EFFECTCRAFT_ANDROID_EXPORT_DEVICE_PREFLIGHT_V2" "$HEADER_SRC"
          echo "Verified comprehensive Android export resource preflight is present in the APK source."
          APK_COUNT="$(find output -maxdepth 1 -type f -name '*.apk' | wc -l)"
          test "$APK_COUNT" -eq 1
          APK="$(find output -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          WORKER_PROBE="$(mktemp)"
          unzip -p "$APK" "lib/arm64-v8a/libeffectcraft-ai-video-worker.so" > "$WORKER_PROBE"
          test -s "$WORKER_PROBE"
          strings "$WORKER_PROBE" > "$WORKER_PROBE.strings"
          grep -Fq "gpu_count=" "$WORKER_PROBE.strings"
          grep -Fq "cpu_count=" "$WORKER_PROBE.strings"
          rm -f "$WORKER_PROBE" "$WORKER_PROBE.strings"
          echo "Verified the packaged ARM64 AI worker contains CPU/GPU capability probing."
          SIZE="$(stat -c%s "$APK")"
          test "$SIZE" -gt 1000000
          # Keep the single-file package below the 2 GiB boundary and validate every ZIP CRC.
          test "$SIZE" -lt 2147483648
          FILE_DESCRIPTION="$(file -b "$APK")"
          echo "Detected package type: $FILE_DESCRIPTION"
          case "$FILE_DESCRIPTION" in
            *"Android package (APK)"*|*"Zip archive"*) ;;
            *)
              echo "The generated file is not recognized as an APK/ZIP package: $FILE_DESCRIPTION" >&2
              exit 1
              ;;
          esac
          # The Android package format is ZIP-based. Validate its complete central directory
          # and every entry CRC rather than relying on the host 'file' utility's wording.
          unzip -tq "$APK"
          APK_ENTRIES="$(mktemp)"
          unzip -Z1 "$APK" > "$APK_ENTRIES"
          grep -Fxq "AndroidManifest.xml" "$APK_ENTRIES"
          grep -Fxq "resources.arsc" "$APK_ENTRIES"
          grep -Eq '^classes[0-9]*[.]dex$' "$APK_ENTRIES"
          grep -Fxq "lib/arm64-v8a/libeffectcraft-ai-video-worker.so" "$APK_ENTRIES"
          grep -Fxq "assets/models/DeepSeek-R1-Distill-Qwen-1.5B-IQ4_XS.gguf" "$APK_ENTRIES"
          grep -Fxq "assets/models/rife-v4.6/flownet.bin" "$APK_ENTRIES"
          grep -Fxq "assets/models/realesrgan-x4plus.bin" "$APK_ENTRIES"
          rm -f "$APK_ENTRIES"
          echo "Verified APK contains DEX, DeepSeek, RIFE 4.6, Real-ESRGAN x4 and Android native worker."
          echo "Verified APK: $APK ($SIZE bytes)"
          sha256sum "$APK"

      - name: Verify APK signature, Android manifest and alignment
        if: success()
        working-directory: artcraft
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find output -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          APK_SIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          test -x "$APK_SIGNER"
          test -x "$AAPT"
          test -x "$ZIPALIGN"

          echo "Checking APK v1/v2/v3 signatures and signer certificate..."
          SIGNATURE_REPORT="$("$APK_SIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\\n' "$SIGNATURE_REPORT"
          # Require all three install-compatible APK signature schemes. v2/v3 cover modern
          # Android; v1 adds compatibility with OEM installer implementations.
          for SCHEME in \
            "Verified using v1 scheme (JAR signing): true" \
            "Verified using v2 scheme (APK Signature Scheme v2): true" \
            "Verified using v3 scheme (APK Signature Scheme v3): true"; do
            printf '%s\\n' "$SIGNATURE_REPORT" | grep -Fq "$SCHEME" || {
              echo "Required APK signature scheme missing: $SCHEME" >&2
              exit 1
            }
          done
          EXPECTED_CERT="$(keytool -list -v -keystore keys/artcraft-builder.jks \
            -storepass "$(<keys/.keystore-password)" -alias artcraftbuilder \
            | awk -F': ' '/SHA256:/{gsub(/:/,"",$2); print tolower($2); exit}')"
          ACTUAL_CERT="$(printf '%s\\n' "$SIGNATURE_REPORT" \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{gsub(/:/,"",$2); print tolower($2); exit}')"
          test -n "$EXPECTED_CERT"
          test -n "$ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"
          # Preserve the Build 17 signing identity so this release remains an in-place
          # compatible update for installations signed by the original release key.
          EXPECTED_RELEASE_CERT="3709d0d071dbcb63bbc34c70887910f699e07aaaa53bc9c539558d303916068a"
          test "$ACTUAL_CERT" = "$EXPECTED_RELEASE_CERT"
          echo "Verified APK uses the same persistent signing certificate as Build 17."

          echo "Checking ZIP alignment..."
          "$ZIPALIGN" -c -v 4 "$APK"

          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\\n' "$BADGING" | grep -Fq "package: name='com.artcraft.effectcraft'"
          printf '%s\\n' "$BADGING" | grep -Fq "sdkVersion:'28'"
          printf '%s\\n' "$BADGING" | grep -Fq "native-code: 'arm64-v8a'"
          echo "$BADGING" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:|launchable-activity:)"
          echo "APK signature, manifest, ABI and alignment checks passed."

      - name: Detect built APK for direct download
        id: apk_available
        if: always() && steps.build_apk.outcome == 'success'
        working-directory: artcraft
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find output -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -n "$APK" && -s "$APK" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "APK is available for release upload: $APK"
            stat -c 'APK size: %s bytes' "$APK"
            sha256sum "$APK"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No non-empty APK was produced; skipping download publication."
          fi

      - name: Publish standalone APK release
        if: success() && steps.apk_available.outputs.available == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: effectcraft-ai-${{ github.run_number }}
          name: EffectCraft 0.21.1 AI Android APK (Build ${{ github.run_number }})
          body: |
            Standalone Android APK built by GitHub Actions.
            Install the attached .apk file directly; no ZIP extraction is required.
            This APK is published only after package integrity, APK signature, certificate identity,
            Android manifest, ARM64 ABI and ZIP alignment validations all pass.
          files: artcraft/output/*.apk
          draft: false
          prerelease: true


      - name: Upload build log if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: EffectCraft-Android-build-log
          path: artcraft/logs/*.log
          if-no-files-found: ignore
          retention-days: 30

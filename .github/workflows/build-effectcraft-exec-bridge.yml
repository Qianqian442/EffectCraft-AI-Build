name: Build EffectCraft Bionic exec bridge

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/windows-plugin-runtime
    paths:
      - '.github/workflows/build-effectcraft-exec-bridge.yml'
      - 'windows-compat/android-runtime/exec-bridge/**'

permissions:
  contents: read

concurrency:
  group: effectcraft-exec-bridge
  cancel-in-progress: true

jobs:
  host-test:
    name: Test exec interception and linker argument preservation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run host-side interception tests
        run: |
          bash windows-compat/android-runtime/exec-bridge/tests/run_host_tests.sh

  android-arm64:
    name: Build Bionic ARM64 exec bridge and ELF fixtures
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build make python3

      - name: Install Android NDK r26b
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip -O "$RUNNER_TEMP/android-ndk.zip"
          unzip -q "$RUNNER_TEMP/android-ndk.zip" -d "$RUNNER_TEMP"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-r26b" >> "$GITHUB_ENV"

      - name: Build ARM64 shared library
        run: |
          cmake -S windows-compat/android-runtime/exec-bridge \
            -B build/exec-bridge-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-31 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/exec-bridge-arm64 --parallel 2
          test -s build/exec-bridge-arm64/libeffectcraft-exec.so
          file build/exec-bridge-arm64/libeffectcraft-exec.so

      - name: Build native ARM64 child fixtures
        run: |
          CLANG="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang"
          mkdir -p stage/exec-bridge
          "$CLANG" -O2 -Wall -Wextra -Werror -fPIE -pie \
            windows-compat/android-runtime/exec-bridge/tests/exec_child.c \
            -o stage/exec-bridge/exec-child
          "$CLANG" -O2 -Wall -Wextra -Werror -fPIE -pie \
            windows-compat/android-runtime/exec-bridge/tests/exec_parent.c \
            -o stage/exec-bridge/exec-parent
          install -m 0644 build/exec-bridge-arm64/libeffectcraft-exec.so stage/exec-bridge/
          readelf -l stage/exec-bridge/exec-child | grep -F '/system/bin/linker64'
          readelf -l stage/exec-bridge/exec-parent | grep -F '/system/bin/linker64'
          readelf -d stage/exec-bridge/libeffectcraft-exec.so

      - name: Record source and checksums
        run: |
          printf '%s\n' 'EffectCraft app-private Bionic exec bridge prototype' \
            'Architecture: arm64-v8a' \
            'Minimum API: 31' \
            'Launcher: /system/bin/linker64' > stage/exec-bridge/BUILD-INFO.txt
          sha256sum stage/exec-bridge/* > stage/exec-bridge/SHA256SUMS.txt
          mkdir -p artifacts
          tar --zstd -cf artifacts/effectcraft-exec-bridge-arm64.tar.zst -C stage/exec-bridge .
          sha256sum artifacts/effectcraft-exec-bridge-arm64.tar.zst > artifacts/effectcraft-exec-bridge-arm64.tar.zst.sha256

      - name: Upload ARM64 exec bridge prototype
        uses: actions/upload-artifact@v4
        with:
          name: EffectCraft-ExecBridge-Android-ARM64
          path: artifacts/*
          retention-days: 30

name: Protect Ae APK with XopProtector (test only)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/protect-ae-with-xopprotector.yml'
  workflow_run:
    workflows:
      - Build Ae Android APK with shared compatibility validation
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful build workflow run ID containing EffectCraft-Android-APK
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ae-xop-protection-test
  cancel-in-progress: false

jobs:
  protect:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id || '44097354613' }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      XOP_REF: '0.8.5'
    steps:
      - name: Validate source build run ID
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid source workflow run ID" >&2; exit 1; }
          echo "Using successful Ae build run: $SOURCE_RUN_ID"

      - name: Download original signed Ae APK artifact
        uses: actions/download-artifact@v4
        with:
          name: EffectCraft-Android-APK
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release

      - name: Check out XopProtector source
        uses: actions/checkout@v4
        with:
          repository: xopJack/XopProtector
          ref: 0.8.5
          path: xop

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Remove developer-local Windows SDK path from Linux CI checkout
        working-directory: xop
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("settings.gradle.kts")
          source = path.read_text(encoding="utf-8")
          windows_only = '    file("E:/Android/SDK-Android@5.14-20260706/SDK/libs"),\\n'
          if windows_only in source:
              source = source.replace(windows_only, "", 1)
          elif "E:/Android/SDK-Android@5.14-20260706/SDK/libs" in source:
              raise SystemExit("Found the Windows SDK path in an unexpected form; refusing an unsafe rewrite.")
          path.write_text(source, encoding="utf-8")
          if "E:/Android/SDK-Android@5.14-20260706/SDK/libs" in source:
              raise SystemExit("Windows-only path still remains in the CI settings file.")
          print("Removed only the upstream developer-local Windows SDK candidate for this CI checkout.")
          PY

      - name: Install Android SDK, NDK and CMake for Xop shell
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platforms;android-34" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build XopProtector packer and Android shell from pinned source
        working-directory: xop
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :packer:jar exportShellFiles
          test -s executable/shell-files/dex/classes.dex
          test -s executable/shell-files/libs/arm64-v8a/libprotector.so
          test -s executable/shell-files/libs/arm64-v8a/libshadowhook.so
          find packer/build/libs -maxdepth 1 -type f -name 'protector-packer-*.jar' -print
          find executable/shell-files -maxdepth 3 -type f -print | sort

      - name: Restore the same persistent Ae release-signing key
        id: signing_key_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            artcraft/keys/artcraft-builder.jks
            artcraft/keys/.keystore-password
          key: effectcraft-apk-signing-v1-${{ github.repository_id }}

      - name: Validate original APK signature and persistent signing key
        shell: bash
        run: |
          set -euo pipefail
          APK="release/effectcraft-0.21.1.apk"
          KEYSTORE="artcraft/keys/artcraft-builder.jks"
          PASSWORD_FILE="artcraft/keys/.keystore-password"
          test -s "$APK"
          test -s "$KEYSTORE"
          test -s "$PASSWORD_FILE"
          KEY_PASSWORD="$(<"$PASSWORD_FILE")"
          keytool -list -keystore "$KEYSTORE" -storepass "$KEY_PASSWORD" -alias artcraftbuilder >/dev/null

          APK_CERT="$(
            apksigner verify --verbose --print-certs "$APK" |
              awk -F': ' '/Signer #1 certificate SHA-256 digest/ { gsub(/:/, "", $2); print toupper($2); exit }'
          )"
          KEY_CERT="$(
            keytool -exportcert -keystore "$KEYSTORE" -storepass "$KEY_PASSWORD" -alias artcraftbuilder |
              sha256sum | awk '{print toupper($1)}'
          )"
          test -n "$APK_CERT"
          test "$APK_CERT" = "$KEY_CERT" || {
            echo "The downloaded APK is not signed by the persistent Ae release key; refusing to re-sign with a different identity." >&2
            exit 1
          }
          echo "Original Ae APK and persistent release key have matching SHA-256 signer: $APK_CERT"

      - name: Protect a separate APK copy with XopProtector
        shell: bash
        run: |
          set -euo pipefail
          INPUT_APK="$GITHUB_WORKSPACE/release/effectcraft-0.21.1.apk"
          OUTPUT_APK="$GITHUB_WORKSPACE/release/ae-xopprotected-test.apk"
          KEYSTORE="$GITHUB_WORKSPACE/artcraft/keys/artcraft-builder.jks"
          KEY_PASSWORD="$(<"$GITHUB_WORKSPACE/artcraft/keys/.keystore-password")"
          PACKER_JAR="$(find "$GITHUB_WORKSPACE/xop/packer/build/libs" -maxdepth 1 -type f -name 'protector-packer-*.jar' -print -quit)"
          test -s "$PACKER_JAR"

          # Start with balanced DEX encryption and SAFE eligible-SO protection.
          # Keep VMP out of payment paths for this first compatibility pass.
          # RASP is alert-only and root/emulator/CRC heuristics are disabled to avoid
          # blocking legitimate OEM devices or CI test environments.
          java -Xmx6g -jar "$PACKER_JAR" "$INPUT_APK" \
            -o "$OUTPUT_APK" \
            --shell-dir "$GITHUB_WORKSPACE/xop/executable/shell-files" \
            --profile balanced \
            --no-payment-auto-vmp \
            --protect-so \
            --protect-so-mode safe \
            --risk-flags 50 \
            --rasp-action 0 \
            --report-enabled 0 \
            --keystore "$KEYSTORE" \
            --alias artcraftbuilder \
            --storepass "$KEY_PASSWORD" \
            --keypass "$KEY_PASSWORD"

          test -s "$OUTPUT_APK"
          sha256sum "$INPUT_APK" "$OUTPUT_APK"
          stat -c 'Protected APK size: %s bytes' "$OUTPUT_APK"

      - name: Verify protected APK package, payload, signature and alignment
        shell: bash
        run: |
          set -euo pipefail
          INPUT_APK="release/effectcraft-0.21.1.apk"
          OUTPUT_APK="release/ae-xopprotected-test.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APK_SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          unzip -tq "$OUTPUT_APK"
          "$APK_SIGNER" verify --verbose --print-certs "$OUTPUT_APK"
          "$ZIPALIGN" -c -P 16 -v 4 "$OUTPUT_APK"

          ORIG_META="$("$AAPT" dump badging "$INPUT_APK" | grep -E '^(package:|sdkVersion:|targetSdkVersion:)')"
          PROTECTED_META="$("$AAPT" dump badging "$OUTPUT_APK" | grep -E '^(package:|sdkVersion:|targetSdkVersion:)')"
          test "$ORIG_META" = "$PROTECTED_META" || {
            echo "Xop output changed the Ae package identity or SDK metadata." >&2
            diff -u <(printf '%s\n' "$ORIG_META") <(printf '%s\n' "$PROTECTED_META") || true
            exit 1
          }

          unzip -Z1 "$OUTPUT_APK" | grep -Fxq 'assets/protector/dexes.zip'
          unzip -Z1 "$OUTPUT_APK" | grep -Fxq 'lib/arm64-v8a/libprotector.so'

          APK_CERT="$(
            "$APK_SIGNER" verify --verbose --print-certs "$OUTPUT_APK" |
              awk -F': ' '/Signer #1 certificate SHA-256 digest/ { gsub(/:/, "", $2); print toupper($2); exit }'
          )"
          KEY_PASSWORD="$(<artcraft/keys/.keystore-password)"
          KEY_CERT="$(
            keytool -exportcert -keystore artcraft/keys/artcraft-builder.jks -storepass "$KEY_PASSWORD" -alias artcraftbuilder |
              sha256sum | awk '{print toupper($1)}'
          )"
          test "$APK_CERT" = "$KEY_CERT"
          echo "Protected APK passed structure/signature checks and retains the original Ae signing identity."
          echo "$APK_CERT" > release/xop-signer-sha256.txt
          printf 'XopProtector source tag: %s\n' "$XOP_REF" > release/xop-protection-info.txt
          printf 'Protection profile: balanced DEX + SAFE eligible SO\n' >> release/xop-protection-info.txt
          printf 'RASP test profile: alert-only; root/emulator/CRC checks disabled\n' >> release/xop-protection-info.txt
          sha256sum "$OUTPUT_APK" > release/xop-protected-sha256.txt
          cp "$GITHUB_WORKSPACE/xop/LICENSE" release/XopProtector-LICENSE.txt
          cp "$GITHUB_WORKSPACE/xop/NOTICE" release/XopProtector-NOTICE.txt

      - name: Upload Xop-protected APK as a test artifact only
        uses: actions/upload-artifact@v4
        with:
          name: Ae-XopProtector-Protected-Test
          path: |
            release/ae-xopprotected-test.apk
            release/xop-protected-sha256.txt
            release/xop-signer-sha256.txt
            release/xop-protection-info.txt
            release/XopProtector-LICENSE.txt
            release/XopProtector-NOTICE.txt
          compression-level: 0
          retention-days: 14

  android-12-smoke-test:
    name: Install and launch Xop-protected Ae on Android 12 ARM64 emulator
    needs: protect
    if: needs.protect.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Download Xop-protected test APK
        uses: actions/download-artifact@v4
        with:
          name: Ae-XopProtector-Protected-Test
          path: release

      - name: Install and launch on Android 12 ARM64
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: arm64-v8a
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            APK="$(find "$GITHUB_WORKSPACE/release" -maxdepth 4 -type f -name 'ae-xopprotected-test.apk' -print -quit)"
            echo "Workspace: $GITHUB_WORKSPACE"
            find "$GITHUB_WORKSPACE/release" -maxdepth 4 -type f -printf '%p (%s bytes)\\n' || true
            test -n "$APK" && test -s "$APK"
            echo "Installing protected APK: $APK"
            adb shell getprop ro.product.cpu.abi
            adb install "$APK"
            adb shell pm path com.artcraft.effectcraft
            adb shell monkey -p com.artcraft.effectcraft 1
            for attempt in $(seq 1 30); do
              if adb shell pidof com.artcraft.effectcraft >/dev/null 2>&1; then
                echo "Ae process is running after Xop protection."
                adb shell dumpsys package com.artcraft.effectcraft | grep -E "versionCode|versionName"
                exit 0
              fi
              sleep 2
            done
            adb logcat -d -t 600 | grep -E -i "FATAL EXCEPTION|Fatal signal|AndroidRuntime|libprotector|effectcraft" | tail -n 120 || true
            echo "Ae did not remain running after Xop-protected launch." >&2
            exit 1
